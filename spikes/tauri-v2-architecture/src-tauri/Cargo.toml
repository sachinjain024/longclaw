[package]
name = "longclaw-tauri-spike"
version = "0.0.0"
description = "Throwaway Tauri v2 architecture spike for LongClaw"
authors = ["LongClaw"]
edition = "2021"

[lib]
name = "longclaw_tauri_spike_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "longclaw-tauri-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
notify = "8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
