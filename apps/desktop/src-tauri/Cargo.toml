[package]
name = "longclaw-desktop"
version = "0.1.0"
description = "LongClaw local-first desktop application"
authors = ["LongClaw"]
edition = "2021"
license = "MPL-2.0"

[lib]
name = "longclaw_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "longclaw-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
notify = "8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# `renamex_np(RENAME_SWAP)`: the only way to replace a file and still hold the
# bytes it displaced. See `core::storage::atomic_replace`.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
