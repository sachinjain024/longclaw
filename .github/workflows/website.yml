# Builds and publishes the LongClaw website (apps/website) to GitHub Pages.
#
# The site is static and independent of the desktop app, so this runs on its
# own paths filter rather than in ci.yml: an app-only change should not
# redeploy the site, and a copy fix should not wait on a macOS bundle.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'apps/website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install
        run: npm --prefix apps/website ci

      - name: Type-check and build
        run: npm --prefix apps/website run verify

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    # A pull request gets the build as a gate; only main is published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
