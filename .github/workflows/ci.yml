name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  desktop:
    name: Desktop quality gate
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Run quality gate
        run: npm run verify

      - name: Build desktop application
        run: npm run build:app

  theme-matrix:
    # The V0-37 visual regression matrix: every theme preset × appearance over
    # the core screens, checking rendered contrast and actor distinction from
    # computed styles. Unlike the removed interaction-budget job below, nothing
    # here measures time, so a shared runner's speed cannot fail it.
    name: Theme matrix
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Install WebKit
        run: npx playwright-core install webkit
        working-directory: apps/desktop

      - name: Run the matrix
        run: npm run matrix
        working-directory: apps/desktop

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-matrix-renders
          path: apps/desktop/dist-matrix/

# There was an `Interaction budgets` job here that ran `perf:board` and
# `perf:list`. It was removed on 2026-08-01, the first time it ever ran on a
# runner, because it asserts a budget the runner cannot meet at any project size.
#
# Run 30675271000: scroll p95 75ms and filter p95 86ms against the ≤50ms budget,
# where the same commit measures 18ms and 30ms on a developer Mac. The number that
# settles it is the harness's own 600-ticket floor — filter p95 77ms, over budget
# at an eighth of the project size — alongside a first paint of 1226ms against
# 194ms locally. That is a ~6x slower machine, not a slow board.
#
# The ≤50ms p95 is a Step 4 product budget for real hardware, and raising it to
# whatever a shared runner happens to manage would be greening the gate rather
# than keeping it. The regression signal that *is* machine-independent is the
# full run tracking its own floor, which is what the floor exists for — but the
# floor's sample counts on the runner are too small to calibrate a threshold from
# one noisy run (scroll floor n=16, so its p95 is effectively its max).
#
# Designing that gate is V0-42. Until it lands the budgets are enforced locally
# and nowhere else, which AGENTS.md § Toolchain says plainly.
