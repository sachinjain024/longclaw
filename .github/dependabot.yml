version: 2
# The repository root has no npm entry on purpose: its package.json declares no
# dependencies and only forwards scripts to apps/desktop, so an ecosystem there
# would never have anything to update.
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The website is a separate npm project with its own lockfile, and it was
  # missing here: seven of the ten alerts open on 2026-09-11 lived in
  # apps/website/package-lock.json, where nothing was watching for them.
  - package-ecosystem: npm
    directory: /apps/website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
