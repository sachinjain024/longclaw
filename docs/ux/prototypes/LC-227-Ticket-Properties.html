/* ========================================================================
   SCENE 2 — the four due rungs
   ========================================================================

   Both appearances at once, because the tokens are attribute-scoped and a
   review that toggles between them is a review remembering rather than
   comparing. Press `+ day` in the driver and watch the whole set walk up the
   ladder — and watch the card heights not move.
*/

function rungRow(offset, status, label) {
  const due = addDays(app.today, offset);
  const which = rung(due, app.today, project.properties.due.attention_days, status, false);
  return (
    '<tr><td class="typed">' + esc(iso(due)) + "</td>" +
    '<td><span class="due-chip ' + which +
    (app.overdueWash && which === "overdue" ? " washed" : "") + '">' +
    esc(rungText(due, app.today, which)) + "</span></td>" +
    '<td class="means">' + esc(label) + "</td></tr>"
  );
}

function rungsIn(appearance) {
  const shown = tickets().filter((t) => t.due).slice(0, 4);
  return (
    '<div class="appearance-frame" data-theme="' + appearance + '" data-lc-theme="' +
    document.documentElement.dataset.lcTheme + '">' +
    '<span class="name">' + appearance + "</span>" +
    '<div class="stack">' + shown.map(cardHTML).join("") + "</div>" +
    '<div class="list-frame" style="margin-top:14px">' + shown.map(listRowHTML).join("") + "</div>" +
    "</div>"
  );
}

function rungsScene() {
  const attention = project.properties.due.attention_days;
  return (
    "<h2>Four rungs, and only one of them takes a hue</h2>" +
    "<p>The date itself is the weakest rung — visible, but not engaging when it is a fortnight out — and both what the chip <em>says</em> and how it is drawn sharpen as the day approaches. Only <strong>overdue</strong> takes a colour, which is <code>PriorityGlyph</code>'s existing rule rather than a new one. Every rung is legible with the colour removed, because the words differ at every rung.</p>" +
    "<section><h3>The ladder</h3>" +
    '<table class="grammar"><tr><th>due</th><th>the chip</th><th>rung</th></tr>' +
    rungRow(-3, "todo", "overdue · --lc-danger, the one rung that takes a hue") +
    rungRow(0, "todo", "today · monochrome, emphasised") +
    rungRow(3, "todo", "approaching · within attention_days (" + attention + "), ordinary weight") +
    rungRow(20, "todo", "beyond · quiet, and the plain date") +
    rungRow(-11, "done", "stood down · done, canceled or archived — finished, not overdue") +
    "</table></section>" +
    "<section><h3>On the board and in the list, in both appearances</h3>" +
    '<div class="pair">' + rungsIn("light") + rungsIn("dark") + "</div></section>" +
    "<section><h3>The boundary that moves</h3>" +
    '<p class="caption">attention_days = ' + attention +
    ". Overdue and today are absolute; this is the only boundary that moves. <code>0</code> is legal and empties the approaching rung, leaving Today and Beyond — set it in the driver.</p>" +
    "</section>"
  );
}

/* ========================================================================
   SCENE 3 — the card's second footer row
   ========================================================================

   The footer never wraps and holds two chips — one beside a checklist fraction
   (`boardCard.ts:28-30`, `screen-specs.md:155-156`) — so an always-visible date
   would cost a label slot on every ticket that has one. The footer gains a row
   instead.

   That lands on the one thing the board cannot do casually: `boardGeometry.ts`
   pins card heights exactly, and states flatly that there is no third. There
   are now four, and they multiply rather than add.
*/

/**
 * The quick picks a date submenu offers, and the whole of how a date gets into
 * a context menu without the menu becoming a date editor.
 *
 * **The menu never contains a calendar.** Each row is a day the app computes,
 * and the row's `.menu-hint` says which day it computed — so nothing is
 * resolved silently, which is the entire objection the typed grammar raises
 * against `next week`. Refusing to *parse* a computed phrase and offering it as
 * a row a person points at are different acts: one guesses, and one shows its
 * answer before the press.
 *
 * The same rows serve `due` and `start`. Two adjacent controls whose vocabulary
 * differs is what the grammar section already refused for the typed forms, and
 * the argument is unchanged one surface over.
 */
function datePicks(now) {
  const monday = (from) => {
    const ahead = (8 - from.getDay()) % 7 || 7;   // the next one, never today
    return addDays(from, ahead);
  };
  return [
    ["Today", startOfDay(now)],
    ["Tomorrow", addDays(now, 1)],
    ["Next Monday", monday(now)],
    ["In a week", addDays(now, 7)],
  ];
}

/** What a duration project's estimate submenu offers: the values it is made of. */
const DURATION_PICKS = ["30m", "1h", "2h", "4h", "1d", "2d", "1w"];

/**
 * What right-clicking a card offers, with the rows LC-227 adds.
 *
 * `MenuList`'s markup, drawn open rather than behind a right-click so a review
 * can see a submenu and its parent at once. `Move to`, `Priority`, `Archive`
 * and the two copies are `ticketMenu.tsx` as it stands; the four property rows
 * are the proposal.
 *
 * **A row exists only for a property the project has enabled.** Properties ship
 * all off, so the default project's menu is exactly today's menu — which is the
 * only reason four more rows are affordable at all.
 */
function contextMenuHTML(opened) {
  const ticket = tickets()[0];
  // `MenuList` wraps every row in a `div`, and gives that div `menu-anchor` —
  // `position: relative` — only for a submenu, which is what the submenu's
  // `position: absolute; left: 100%` hangs off.
  const row = (id, label, glyph, hint, sub, extra) =>
    '<div class="' + (sub ? "menu-anchor" : "") + '">' +
    '<button type="button" tabindex="-1" class="menu-row" role="menuitem"' +
    (sub ? ' aria-haspopup="menu"' : "") + ">" +
    '<span class="menu-glyph">' + glyph + "</span>" +
    '<span class="menu-label">' + esc(label) + "</span>" +
    (hint ? '<span class="menu-hint">' + hint + "</span>" : "") +
    (sub ? chevron : "") + "</button>" + (extra || "") + "</div>";

  /** One submenu. `choices` are `[label, glyph, hint, checked]`. */
  const sub = (label, choices, clearable) =>
    '<div class="menu-popover menu-sub" role="menu" aria-label="' + esc(label) + '">' +
    choices.map(([text, glyph, hint, checked]) =>
      '<button type="button" tabindex="-1" class="menu-row" role="menuitem' +
      (checked === undefined ? '"' : 'radio" aria-checked="' + checked + '"') + ">" +
      '<span class="menu-glyph">' + (glyph || "") + "</span>" +
      '<span class="menu-label">' + esc(text) + "</span>" +
      (hint ? '<span class="menu-hint">' + hint + "</span>" : "") +
      (checked ? '<span class="menu-check" aria-hidden="true">✓</span>' : "") +
      "</button>").join("") +
    /* Clearing is a first-class act everywhere else this ticket touches, and a
       submenu that can only ever *set* a property is a one-way door. */
    (clearable
      ? '<hr class="menu-rule"><button type="button" tabindex="-1" class="menu-row" role="menuitem">' +
        '<span class="menu-glyph"></span><span class="menu-label">Clear</span></button>'
      : "") +
    "</div>";

  const properties = project.properties;
  const typeValue = properties.type.values[ticket.type];

  const typeSub = sub("Type",
    Object.entries(properties.type.values).map(([slug, value]) =>
      [value.name, '<span class="label-dot label-' + value.color + '"></span>', "", slug === ticket.type]),
    true);

  /* A date submenu: quick picks, each showing the day it resolves to, then the
     way out to the control that can reach any day. The escape is what keeps
     this a shortcut — the menu offers the four dates worth one click and hands
     everything else to the panel, rather than growing a calendar. */
  const dateSub = (which) => {
    const value = ticket[which] ? fromIso(ticket[which]) : undefined;
    return sub(which === "due" ? "Due date" : "Start date",
      datePicks(app.today).map(([text, day]) => [
        text, "", esc(displayDate(day, app.today)),
        Boolean(value && daysBetween(value, day) === 0),
      ]).concat([["Pick a date…", "", "", undefined]]),
      Boolean(value));
  };

  const estimateSub = () => {
    const config = properties.estimate;
    const scale = config.system === "duration" ? DURATION_PICKS
      : config.system === "fibonacci" ? FIBONACCI : TSHIRT;
    const name = (id) => (config.system === "tshirt" ? config.values[id].name : id);
    return sub("Estimate",
      scale.map((id) => [name(id), "", "", id === ticket.estimate]),
      Boolean(ticket.estimate));
  };

  const estimateRead = readEstimate(ticket.estimate, properties.estimate);
  // Only one submenu is open at a time, so the caller names which. The scene
  // draws the menu twice, opened on two different rows.
  const openOn = (id, built) => (opened === id ? built : "");

  return (
    '<div class="menu-popover menu-hinted" role="menu" aria-label="LC-227">' +
    row("status", "Move to", statusDot(ticket.status), esc(statusName(ticket.status)), true) +
    row("priority", "Priority", priorityGlyph(ticket.priority), esc(priorityName(ticket.priority)), true) +
    /* The property rows go under the two they read with rather than under the
       archive rule, which is where the actions start — these say what the
       ticket *is*, and everything below the rule is something you do to it.
       Type first, then the two dates in the rail's own order, then estimate. */
    (properties.type.enabled
      ? row("type", "Type", '<span class="label-dot label-' + typeValue.color + '"></span>',
          esc(typeValue.name), true, openOn("type", typeSub))
      : "") +
    (properties.start.enabled
      ? row("start", "Start date", calendarGlyph,
          ticket.start ? esc(displayDate(fromIso(ticket.start), app.today)) : "", true,
          openOn("start", dateSub("start")))
      : "") +
    (properties.due.enabled
      ? row("due", "Due date", calendarGlyph,
          ticket.due ? esc(displayDate(fromIso(ticket.due), app.today)) : "", true,
          openOn("due", dateSub("due")))
      : "") +
    (properties.estimate.enabled
      ? row("estimate", "Estimate", "",
          estimateRead ? esc(estimateRead.text) : "", true, openOn("estimate", estimateSub()))
      : "") +
    '<hr class="menu-rule">' +
    row("archive", "Archive ticket", '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="2.5" width="11" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.8 5.5 V11 a1 1 0 0 0 1 1 h6.4 a1 1 0 0 0 1-1 V5.5 M5.6 8 h2.8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>', "", false) +
    '<hr class="menu-rule">' +
    row("copy-key", "Copy key", '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="4.5" y="1.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M9.5 12.5 h-7 a1 1 0 0 1-1-1 v-7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>', "<code>LC-227</code>", false) +
    row("copy-path", "Copy file path", folderGlyph, "", false) +
    "</div>"
  );
}

function sumsTable() {
  const row = (name, terms, total, isNew) =>
    '<tr' + (isNew ? ' class="new"' : "") + "><td>" + esc(name) + "</td><td>" + esc(terms) +
    '</td><td class="total">' + total + "px</td></tr>";
  return (
    '<table class="sums"><tr><th>height</th><th>the rows styles.css draws</th><th>pinned</th></tr>' +
    row("--lc-size-board-card", "2 border + 20 pad + 22 key + 44 title + 20 foot", 108, false) +
    row("--lc-size-board-card-properties", "108 + 4 margin + 20 property row", 132, true) +
    row("--lc-size-board-card-acknowledged", "108 + 7 + 1 + 6 + 14 actor footer", 136, false) +
    row("--lc-size-board-card-properties-acknowledged", "132 + 28 actor footer", 160, true) +
    "</table>"
  );
}

function cardScene() {
  const rows = tickets();
  const heights = rows.map((t) => t.key + " " + cardHeight(t) + "px").join("  ·  ");
  return (
    "<h2>The key row carries the date; the footer's second row carries the rest</h2>" +
    "<p>Every due date is on screen and <strong>every card is 108 or 136</strong> — today's two heights. The second row is now estimate and type only, so a project that enables neither never grows a card. Switch <strong>2nd row</strong> to see what it costs when it is enabled, and <strong>key row</strong> to compare the two alignments.</p>" +
    "<section><h3>A column, mixed</h3>" +
    '<div class="stack">' + rows.map(cardHTML).join("") + "</div>" +
    '<p class="caption">' + esc(heights) + "</p></section>" +
    "<section><h3>Beside a checklist fraction</h3>" +
    "<p style=\"max-width:62ch\">The top card has a fraction, a meter and two labels wanting a footer that holds one chip beside a fraction. The date never competed for it — it is two rows up in the key row — so the label that was dropped is dropped for the reason it always was, and nothing about the due made it worse.</p>" +
    '<div class="stack">' + [rows[0], rows[2]].map(cardHTML).join("") + "</div></section>" +
    "<section><h3>Right-click, which nothing had asked about</h3>" +
    "<p style=\"max-width:62ch\"><code>ticketMenu.tsx</code> offers <strong>Move to</strong> and <strong>Priority</strong> as submenus, reusing <code>metaOptions.tsx</code> so \"the values a card can be moved to are the values the panel offers, always\". All four properties join them. The menu is drawn twice below — the same menu, opened on two different rows.</p>" +
    '<div class="menu-demo">' + contextMenuHTML("due") + contextMenuHTML("estimate") + "</div>" +
    "<p style=\"max-width:62ch\"><strong>A row exists only for a property the project has enabled.</strong> Properties ship all off, so the default project's menu is exactly today's menu. That is the only reason four more rows are affordable — a project that turns everything on gets a menu of nine rows, and one that turns nothing on gets the five it has now.</p>" +
    "<p style=\"max-width:62ch\"><strong>The menu never contains a calendar.</strong> The date rows are quick picks, and each says the day it resolves to in its hint — so nothing is computed silently, which is the whole objection the typed grammar raises against <code>next week</code>. Refusing to <em>parse</em> a computed phrase and offering it as a row you point at are different acts: one guesses, the other shows its answer before the press. Anything not on the list goes to <strong>Pick a date…</strong>, which hands the job to the panel's real control.</p>" +
    "<p style=\"max-width:62ch\">Every submenu carries <strong>Clear</strong>, because clearing is first-class everywhere else this ticket touches and a submenu that can only ever set a property is a one-way door. The estimate submenu is the project's own scale — <code>30m · 1h · 2h · 4h · 1d · 2d · 1w</code> under duration, the enum under t-shirt, the sequence under Fibonacci.</p></section>" +
    "<section><h3>Four pinned heights, and what adds up to them</h3>" +
    "<p style=\"max-width:62ch\">This is the sum <code>card-height-guard.mjs</code> checks, inside <code>npm run check</code>. <code>cardStrides()</code> already picks a stride per ticket, so the new case is a second boolean over that rather than a new mechanism.</p>" +
    sumsTable() +
    "<p class=\"caption\">Two runs answer to this beyond the usual gate: <code>probe:drag</code>, because a drop is arithmetic over these offsets (<code>gapAt</code>), and <code>perf:board</code>, because the whole scroll cost is nodes.</p>" +
    "</section>"
  );
}

/* ========================================================================
   SCENE 4 — the estimate control, under each system
   ========================================================================

   Three systems, and a project is on exactly one. The control changes shape
   with the system, and the value on disk changes shape with it — which is why
   switching systems has to preserve what was written under the old one rather
   than destroying it.
*/

function estimateDemo(system, value, note) {
  const was = project.properties.estimate.system;
  project.properties.estimate.system = system;
  const control = estimateControlHTML(value);
  project.properties.estimate.system = was;
  return (
    '<div class="rail-demo">' +
    '<div class="panel-body"><div class="rail-row"><span class="rail-label">Estimate</span><div>' +
    control + "</div></div></div>" +
    '<p class="caption">' + esc(note) + "</p></div>"
  );
}

function estimateScene() {
  const config = project.properties.estimate;
  const rows = tickets().filter((t) => t.estimate).map((t) => {
    const read = readEstimate(t.estimate, config);
    const minutes = estimateMinutes(t.estimate, config);
    return '<tr><td class="typed">' + esc(t.estimate) + '</td><td class="means">' +
      (read.kind === "known" ? esc(read.text) : "unreadable under " + config.system + ", and kept") +
      "</td><td class=\"means\">" + (minutes === undefined ? "—" : Math.round(minutes) + " min") + "</td></tr>";
  }).join("");

  return (
    "<h2>One property, three shapes</h2>" +
    "<p>The scale is the segment the appearance row already uses, with a leading <code>—</code> because absent is a value a scale has to be able to say — and the dash is the app's existing word for it (<code>priority: none</code> draws this glyph). The driver switches the scale to a menu, which is what every other rail row already is: that is the open question here.</p>" +
    "<section><h3>The three systems, at rail width</h3>" +
    '<div style="display:flex; gap:16px; flex-wrap:wrap">' +
    estimateDemo("tshirt", "m", "tshirt · an editable enum, like Type's") +
    estimateDemo("fibonacci", "5", "fibonacci · nothing to configure") +
    estimateDemo("duration", "1.5d", "duration · number plus unit; 1.5d yes, 1d4h no") +
    "</div></section>" +
    "<section><h3>A value written under another system</h3>" +
    "<p style=\"max-width:62ch\">Switching systems never rewrites tickets. A value written under the old one stays exactly as it was, reads as unreadable under the new one rather than being converted or dropped, and is legible again the moment the project switches back. This is invariant 16 at a control.</p>" +
    '<div style="display:flex; gap:16px; flex-wrap:wrap">' +
    estimateDemo("fibonacci", "1.5d", "a duration under Fibonacci") +
    estimateDemo("tshirt", "8", "a story point under T-shirt") +
    "</div></section>" +
    "<section><h3>Why the conversion is a project setting</h3>" +
    "<p style=\"max-width:62ch\">An estimate has to be comparable: <code>4h</code> against <code>1d</code> needs to know how long a working day is, and a project on a six-hour day would otherwise order them wrongly. Changing it changes no stored value.</p>" +
    '<table class="grammar"><tr><th>on disk</th><th>reads as</th><th>at ' +
    config.hours_per_day + "h/day, " + config.days_per_week + "d/week</th></tr>" + rows + "</table></section>"
  );
}

/* ========================================================================
   SCENE 5 — the settings Properties pane
   ========================================================================

   One pane, after Labels, and the type-values editor inside it is the labels
   editor: the same `.label-row` grid, slug and name and colour and a remove.
   That is the claim, and it is the reason `SETTINGS_SECTIONS` gains one row
   with both its labels taken off it.

   The pane's other job is the one that has no dialog: turning a property off
   while tickets carry values.
*/

const SECTIONS = [
  ["general", "General"], ["theme", "Theme"], ["labels", "Labels"],
  ["properties", "Properties"], ["status", "Status fields"],
  ["shortcuts", "Shortcuts"], ["danger", "Danger zone"],
];

/** How many tickets carry a value for a property — off the index, which is
    what makes the count available while the property is off. */
function carrying(name) {
  const counts = { type: 41, due: 17, start: 6, estimate: 23 };
  return counts[name];
}

/** What the tickets keep, in one place — the row and the toast say the same
    words, because they are the same reassurance said twice. */
const KEPT = { type: "types", due: "dates", start: "dates", estimate: "estimates" };

function propertyBlock(name, title, config, body) {
  const count = carrying(name);
  const state = config.enabled
    ? ""
    : '<span class="property-state">· ' + count + " tickets keep their " + KEPT[name] + "</span>";
  return (
    '<div class="property-block">' +
    '<label class="property-head"><input type="checkbox" tabindex="0" data-property="' + name + '"' +
    (config.enabled ? " checked" : "") + ">" + esc(title) + state + "</label>" +
    (config.enabled ? '<div class="property-config">' + body + "</div>" : "") +
    "</div>"
  );
}

function typeValuesEditor() {
  const values = Object.entries(project.properties.type.values);
  return (
    '<div class="type-values">' +
    values.map(([slug, value]) =>
      '<div class="label-row"><code>' + esc(slug) + "</code>" +
      '<input class="input compact" value="' + esc(value.name) + '" aria-label="Name of type ' + esc(slug) + '">' +
      '<span class="label-color-field"><button type="button" tabindex="0" class="menu-trigger label-color-trigger" aria-label="Color of type ' + esc(slug) + '">' +
      '<span class="label-dot label-' + value.color + '"></span>' + chevron + "</button></span>" +
      '<button tabindex="0" class="ghost row-remove" type="button" aria-label="Remove type ' + esc(slug) + '">✕</button></div>').join("") +
    '<form class="label-row label-add">' +
    '<input class="input compact mono" placeholder="slug" aria-label="New type slug">' +
    '<input class="input compact" placeholder="Display name" aria-label="New type name">' +
    '<span class="label-color-field"><button type="button" tabindex="0" class="menu-trigger label-color-trigger" aria-label="New type color">' +
    '<span class="label-dot label-gray"></span>' + chevron + "</button></span>" +
    '<button tabindex="0" class="secondary small" type="submit">Add type</button></form>' +
    "</div>" +
    '<p class="property-note">Removing a definition never rewrites a ticket — the slug renders as itself, in the fallback hue.</p>'
  );
}

function settingsScene() {
  const properties = project.properties;
  const estimate = properties.estimate;

  const dueBody =
    '<div class="property-inline">Highlight tickets due within' +
    '<input class="input compact mono" data-attention value="' + properties.due.attention_days + '" aria-label="Attention days">days</div>' +
    '<p class="property-note">Overdue and today are absolute; this is the only boundary that moves. <code>0</code> is legal and empties the approaching rung.</p>';

  const estimateBody =

/* ========================================================================
   The date picker — the app's first two-dimensional popover
   ========================================================================

   Every menu in the app is a list where `↑↓` cycles rows
   (`keyboard-focus-map.md:136-142`). A month is a grid, so `↑↓` has to mean
   *week* here, and that is why this earns its own row in the keyboard map
   rather than being filed under Menus:

     ← →                a day
     ↑ ↓                a week
     PageUp/PageDown    a month
     ⇧PageUp/⇧PageDown  a year
     Home / End         the week's first and last day
     Enter              pick → write → close → focus returns to the field
     Esc                close, changing nothing → focus returns to the field

   `Enter` and `Esc` are deliberately the menu contract unchanged: pick applies
   and returns focus, `Esc` walks one rung of the ladder. Only the movement
   keys are new, because only the shape is.

   It never opens on focus. A popover that appeared every time Tab passed
   through would cover the panel and fight the field it is attached to. It
   opens three ways: a click on the trigger, `Enter` on the trigger, or `↓`
   from inside the field.
*/

/**
 * Where the picker goes. `popover.ts` already answers this and the answer is
 * not "at the anchor's left edge": `belowAnchor(anchor, width)` right-aligns a
 * popover on its trigger precisely for "a trigger at the window's far edge (the
 * header gear)", and a date field in a right-hand rail is exactly that trigger.
 * Hung left-aligned it ran off the side of a 1440px window — which is the
 * defect `placeAtPoint`'s `fitAxis` exists to prevent, and which this reaches
 * by giving it a width to align by.
 */
const PICKER_WIDTH = 236;
const POPOVER_GAP = 4;
const VIEWPORT_MARGIN = 8;

function placePicker(rect) {
  return {
    left: Math.max(VIEWPORT_MARGIN, rect.right - PICKER_WIDTH),
    top: rect.bottom + POPOVER_GAP,
  };
}

/**
 * `popover.ts`'s `liftIntoView`, unchanged: how far a popover has to come up to
 * sit inside the window, never lifted past the top.
 *
 * The picker is the tallest popover the app will have — six weeks of grid, a
 * header and a Clear row, 253px — and it hangs off a rail row that can be
 * anywhere down a full-height panel. Six rows down an 800px panel it ran 27px
 * past the bottom of a 950px window, which is a Clear row a pointer cannot
 * reach and a last week a person cannot see.
 */
function liftIntoView(box, viewportHeight) {
  const over = box.bottom - (viewportHeight - VIEWPORT_MARGIN);
  if (over <= 0) return 0;
  return Math.max(0, Math.min(over, box.top - VIEWPORT_MARGIN));
}

function pickerHTML() {
  if (!app.picker) return "";
  const { which, rect, cursor } = app.picker;
  const at = placePicker(rect);
  const state = dateState[which];
  const parsed = parseDate(state.text, app.today);
  const picked = parsed.kind === "date" ? parsed.date : undefined;

  // Monday first, derived rather than picked: the app has no locale to ask,
  // the canonical on-disk form is ISO 8601, and ISO 8601's week starts Monday.
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const lead = (first.getDay() + 6) % 7;
  const start = addDays(first, -lead);

  const cells = [];
  for (let index = 0; index < 42; index += 1) {
    const day = addDays(start, index);
    const classes = ["date-cell"];
    if (day.getMonth() !== cursor.getMonth()) classes.push("adjacent");
    // Today and the current value are two different marks, because a ticket
    // due today wears both on one cell.
    if (daysBetween(app.today, day) === 0) classes.push("now");
    if (picked && daysBetween(picked, day) === 0) classes.push("picked");
    cells.push(
      '<button type="button" class="' + classes.join(" ") + '" data-day-pick="' + iso(day) +
      '" tabindex="' + (daysBetween(cursor, day) === 0 ? 0 : -1) + '" aria-label="' + esc(echoDate(day)) + '">' +
      day.getDate() + "</button>",
    );
  }

  return (
    '<div class="menu-popover date-picker" role="dialog" aria-label="Choose a date" ' +
    'style="left:' + Math.round(at.left) + "px; top:" + Math.round(at.top) + 'px">' +
    '<div class="date-picker-head">' +
    '<strong>' + MONTHS[cursor.getMonth()] + " " + cursor.getFullYear() + "</strong>" +
    '<button type="button" tabindex="-1" class="date-step" data-month-step="-1" aria-label="Previous month">‹</button>' +
    '<button type="button" tabindex="-1" class="date-step" data-month-step="1" aria-label="Next month">›</button>' +
    "</div>" +
    '<div class="date-grid">' +
    ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => '<span class="dow">' + d + "</span>").join("") +
    cells.join("") + "</div>" +
    '<button type="button" tabindex="-1" class="date-clear" data-day-pick="">Clear</button>' +
    "</div>"
  );
}

/* -------------------------------------------------------------- the menus */

function menuHTML() {
  if (!app.menu) return "";
  const { kind, rect } = app.menu;
  const ticket = tickets()[0];
  const rows =
    kind === "status"
      ? STATUSES.map(([id, name]) => ({ id, name, glyph: statusDot(id), on: ticket.status === id }))
      : kind === "priority"
        ? PRIORITIES.map(([id, name]) => ({ id, name, glyph: priorityGlyph(id), on: ticket.priority === id }))
        : kind === "type"
          ? Object.entries(project.properties.type.values).map(([slug, value]) => ({
              id: slug, name: value.name,
              glyph: '<span class="label-dot label-' + value.color + '"></span>',
              on: ticket.type === slug,
            }))
          : kind === "unit"
            ? UNITS.map(([id, name]) => ({ id, name, glyph: "", on: false }))
            : kind === "estimate"
              ? (project.properties.estimate.system === "fibonacci" ? FIBONACCI : TSHIRT).map((id) => ({
                  id, name: project.properties.estimate.system === "fibonacci" ? id : project.properties.estimate.values[id].name,
                  glyph: "", on: false,
                }))
              : Object.entries(project.labels).map(([slug, label]) => ({
                  id: slug, name: label.name,
                  glyph: '<span class="label-dot label-' + label.color + '"></span>',
                  on: ticket.labels.includes(slug),
                }));
  return (
    '<div class="menu-popover" role="menu" aria-label="' + esc(kind) + '" style="left:' +
    Math.round(rect.left) + "px; top:" + Math.round(rect.bottom + 6) + 'px">' +
    rows.map((row) =>
      '<button type="button" tabindex="-1" class="menu-row" role="menuitemradio" aria-checked="' + row.on + '">' +
      (row.glyph ? '<span class="menu-glyph">' + row.glyph + "</span>" : "") +
      '<span class="menu-label">' + esc(row.name) + "</span>" +
      (row.on ? '<span class="menu-check" aria-hidden="true">✓</span>' : "") + "</button>").join("") +
    "</div>"
  );
}

      toggle("second", "everything", app.secondRow, "+type") +
      '<span class="sep" aria-hidden="true"></span><span>row</span>' +
      toggle("above", "1", app.rowAbove ? "1" : "0", "above") +
      toggle("above", "0", app.rowAbove ? "1" : "0", "below");

  if (app.scene === "estimate")
    return "<span>control</span>" +
      toggle("control", "segment", app.estimateControl, "segment") +
      toggle("control", "menu", app.estimateControl, "menu");

  return "<span>system</span>" +
    [["tshirt", "t-shirt"], ["fibonacci", "fib"], ["duration", "duration"]].map(([id, name]) =>
      toggle("system", id, project.properties.estimate.system, name)).join("");
}

/* ----------------------------------------------------------- rendering */

const SCENES = { panel: panelScene, rungs: rungsScene, card: cardScene, estimate: estimateScene, settings: settingsScene };

/** Which field held the caret, so a re-render does not drop it on the floor. */
let caret;

function render() {
  const active = document.activeElement;
  if (active && active.dataset && (active.dataset.date || active.dataset.estimate))
    caret = { key: active.dataset.date ? "date" : "estimate", value: active.dataset.date || active.dataset.estimate, at: active.selectionStart };

  $("#scene").innerHTML = SCENES[app.scene]();
  $("#notes").innerHTML = NOTES[app.scene]();
  $("#scene-controls").innerHTML = controlsHTML();
  $("#overlay").innerHTML = menuHTML() + pickerHTML();
  $("#today-readout").textContent = "today = " + iso(app.today) + " · " + echoDate(app.today);

  if (app.picker) {
    /* Two passes rather than one, which is `usePointPlacement`'s reason
       unchanged: nothing knows how tall the grid is until its cells exist, so
       it is drawn at the anchor and corrected before paint. */
    const box = document.querySelector(".date-picker");
    if (box) {
      const lift = liftIntoView(box.getBoundingClientRect(), window.innerHeight);
      if (lift) box.style.top = Math.round(box.getBoundingClientRect().top - lift) + "px";
    }
    const cell = document.querySelector('.date-cell[tabindex="0"]');
    if (cell) cell.focus();
  } else if (caret && caret.key === "date") {
    const field = document.querySelector('[data-date="' + caret.value + '"]');
    if (field) {
      field.focus();
      const at = caret.at === null ? field.value.length : caret.at;
      field.setSelectionRange(at, at);
    }
  }
}

/** One toast at a time, replacing — which is what `WriteFeedback.tsx:172-176` draws. */
function toast(text) {
  $("#toasts").innerHTML =
    '<div class="toast"><span class="toast-message">' + esc(text) + "</span>" +
    '<button class="toast-action" tabindex="-1" type="button">Undo <kbd>⌘Z</kbd></button></div>';
  clearTimeout(app.toastTimer);
  app.toastTimer = setTimeout(() => { $("#toasts").innerHTML = ""; }, 5000);
}

/* -------------------------------------------------------------- wiring */

/**
 * Parsing happens on commit — Enter or blur — not per keystroke. What the
 * field shows *while* typing is the echo, and only once the text resolves.
 */
function commitDate(which) {
  const state = dateState[which];
  if (!dirty(state)) { state.refused = undefined; return render(); }
  const parsed = parseDate(state.text, app.today);
  if (parsed.kind === "refused") {
    // What is refused is not destroyed: the field keeps the text and reports
    // that it did not resolve. The property is not written, so `value` is
    // untouched — which is the whole reason the two are held apart.
    state.refused = parsed.why;
  } else if (parsed.kind === "date") {
    state.refused = undefined;
    state.value = iso(parsed.date);
    // What lands back in the field is the form that reads back as this day.
    state.text = fieldDate(parsed.date, app.today);
    toast("LC-227 " + (which === "due" ? "due" : "starts") + " " + state.value);
  } else {
    // Emptying the field and committing removes the property. On disk absent
    // and cleared are the same thing — no key — so the distinction lives in
    // the edit command, where absent means *do not touch this*.
    state.refused = undefined;
    const had = state.value;
    state.value = undefined;
    state.text = "";
    if (had) toast("LC-227 " + which + " cleared");
  }
  render();
}

/**
 * Where the picker opens: the month of the current value, or today when there
 * is none. The *value*, not a re-parse of the field — a field holding a refused
 * string still belongs to the day the ticket says, and the calendar should open
 * on that rather than on nothing.
 */
function pickerCursor(which) {
  const state = dateState[which];
  if (dirty(state)) {
    const parsed = parseDate(state.text, app.today);
    if (parsed.kind === "date") return parsed.date;
  }
  return state.value ? fromIso(state.value) : app.today;
}

/** Typing and picking produce the same value through the same normalisation. */
function writeDate(which, date) {
  const state = dateState[which];
  state.value = date ? iso(date) : undefined;
  state.text = date ? fieldDate(date, app.today) : "";
  state.refused = undefined;
  toast(date
    ? "LC-227 " + (which === "due" ? "due" : "starts") + " " + state.value
    : "LC-227 " + which + " cleared");
}

document.addEventListener("input", (event) => {
  const field = event.target;
  if (field.dataset && field.dataset.date) {
    const state = dateState[field.dataset.date];
    state.text = field.value;
    // A refusal on screen is answered by typing: it goes the moment the text
    // changes, rather than standing until the next commit says so.
    state.refused = undefined;
    render();
  }
});

document.addEventListener("focusout", (event) => {
  const field = event.target;
  if (field.dataset && field.dataset.date && !app.picker) commitDate(field.dataset.date);
});

document.addEventListener("click", (event) => {
  const hit = (attr) => event.target.closest("[data-" + attr + "]");

  const scene = hit("scene");
  if (scene) { app.scene = scene.dataset.scene; app.menu = app.picker = undefined;
    document.querySelectorAll("[data-scene]").forEach((b) => b.setAttribute("aria-pressed", String(b === scene)));
    return render(); }

  const appearance = hit("appearance");
  if (appearance) {
    document.documentElement.dataset.theme = appearance.dataset.appearance;
    document.querySelectorAll("[data-appearance]").forEach((b) => b.setAttribute("aria-pressed", String(b === appearance)));
    return render();
  }
  const themePick = hit("theme-pick");
  if (themePick) {
    document.documentElement.dataset.lcTheme = themePick.dataset.themePick;
    document.querySelectorAll("[data-theme-pick]").forEach((b) => b.setAttribute("aria-pressed", String(b === themePick)));
    return render();
  }

  const day = hit("day");
  if (day) {
    // Which fields were showing what the file says has to be asked *before*
    // the day moves, because that is the question the old day answers.
    const clean = ["due", "start"].filter(
      (which) => !dirty(dateState[which]) && dateState[which].refused === undefined,
    );
    app.today = addDays(app.today, Number(day.dataset.day));
    // A clean field re-reads its value, because the display form of a date
    // depends on the day it is read on — the same recompute the app owes a due
    // date at midnight. A field being typed into keeps its draft, so the echo
    // can be watched changing under a moving `today`.
    for (const which of clean)
      dateState[which].text = dateState[which].value
        ? fieldDate(fromIso(dateState[which].value), app.today)
        : "";
    return render();
  }

  const width = hit("width");
  if (width) { app.panelWidth = Number(width.dataset.width); return render(); }
  const echo = hit("echo");
  if (echo) { app.echo = echo.dataset.echo === "on"; return render(); }
  const attention = hit("attention");
  if (attention && attention.dataset.attention !== "") {
    project.properties.due.attention_days = Number(attention.dataset.attention); return render();
  }
  const wash = hit("wash");
  if (wash) { app.overdueWash = wash.dataset.wash === "on"; return render(); }
  const second = hit("second");
  if (second) { app.secondRow = second.dataset.second; return render(); }
  const above = hit("above");
  if (above) { app.rowAbove = above.dataset.above === "1"; return render(); }
  const control = hit("control");
  if (control) { app.estimateControl = control.dataset.control; return render(); }
  const system = hit("system");
  if (system) {
    // Switching systems preserves values written under the old one rather than
    // destroying them. Nothing is rewritten here, and nothing is in the app.
    project.properties.estimate.system = system.dataset.system;
    toast("Estimates now read as " + system.dataset.system + " · 23 tickets keep their values");
    return render();
  }

  const picker = hit("picker");
  if (picker) {
    const which = picker.dataset.picker;
    app.picker = app.picker && app.picker.which === which
      ? undefined
      : { which, rect: picker.getBoundingClientRect(), cursor: pickerCursor(which) };
    app.menu = undefined;
    return render();
  }

  const dayPick = hit("day-pick");
  if (dayPick) {
    const which = app.picker.which;
    const value = dayPick.dataset.dayPick;
    writeDate(which, value ? fromIso(value) : undefined);
    app.picker = undefined;
    render();
    const field = document.querySelector('[data-date="' + which + '"]');
    if (field) field.focus();
    return;
  }

  const step = hit("month-step");
  if (step) { app.picker.cursor = addMonths(app.picker.cursor, Number(step.dataset.monthStep)); return render(); }

  const property = hit("property");
  if (property) {
    const name = property.dataset.property;
    const config = project.properties[name];
    config.enabled = !config.enabled;
    const label = { type: "Type", due: "Due", start: "Start", estimate: "Estimate" }[name];
    // The write feedback carries the count and the reassurance together,
    // because the effect of turning it off is otherwise invisible.
    toast(config.enabled
      ? label + " turned on"
      : label + " turned off · " + carrying(name) + " tickets keep their " + KEPT[name]);
    return render();
  }

  const scale = hit("scale");
  if (scale) { toast("LC-227 estimate " + (scale.dataset.scale ? "→ " + scale.dataset.scale : "cleared")); return render(); }

  const menuTriggerEl = hit("menu");
  if (menuTriggerEl) {
    const kind = menuTriggerEl.dataset.menu;
    app.menu = app.menu && app.menu.kind === kind ? undefined : { kind, rect: menuTriggerEl.getBoundingClientRect() };
    app.picker = undefined;
    return render();
  }

  if (app.menu && !event.target.closest(".menu-popover")) { app.menu = undefined; render(); }
  if (app.picker && !event.target.closest(".date-picker") && !event.target.closest(".date-field")) {
    app.picker = undefined; render();
  }
});

document.addEventListener("keydown", (event) => {
  const field = event.target.dataset && event.target.dataset.date ? event.target.dataset.date : undefined;

  // `↓` from inside the field is the combobox affordance, and it costs the
  // single-line field nothing.
  if (field && event.key === "ArrowDown" && !app.picker) {
    event.preventDefault();
    const trigger = document.querySelector('[data-picker="' + field + '"]');
    app.picker = { which: field, rect: trigger.getBoundingClientRect(), cursor: pickerCursor(field) };
    return render();
  }
  if (field && event.key === "Enter") { event.preventDefault(); return commitDate(field); }
  if (field && event.key === "Escape") {
    // The field's own revert, and one rung of the ladder: `Esc` puts the saved
    // value back rather than closing the panel around it — the same rule the
    // label row keeps (`ProjectSettings.tsx`), and an untouched field owes the
    // panel the press.
    const state = dateState[field];
    if (!dirty(state) && state.refused === undefined) return;
    event.stopPropagation();
    state.text = state.value ? fieldDate(fromIso(state.value), app.today) : "";
    state.refused = undefined;
    return render();
  }

  if (!app.picker) return;

  const moves = {
    ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7,
  };
  if (moves[event.key] !== undefined) {
    event.preventDefault();
    app.picker.cursor = addDays(app.picker.cursor, moves[event.key]);
    return render();
  }
  if (event.key === "PageUp" || event.key === "PageDown") {
    event.preventDefault();
    const step = event.key === "PageUp" ? -1 : 1;
    app.picker.cursor = addMonths(app.picker.cursor, event.shiftKey ? step * 12 : step);
    return render();
  }
  if (event.key === "Home" || event.key === "End") {
    event.preventDefault();
    const cursor = app.picker.cursor;
    const offset = (cursor.getDay() + 6) % 7;
    app.picker.cursor = addDays(cursor, event.key === "Home" ? -offset : 6 - offset);
    return render();
  }
  if (event.key === "Enter") {
    event.preventDefault();
    const which = app.picker.which;
    writeDate(which, app.picker.cursor);
    app.picker = undefined;
    render();
    const back = document.querySelector('[data-date="' + which + '"]');
    if (back) back.focus();
    return;
  }
  if (event.key === "Escape") {
    // Close, changing nothing → focus returns to the field. The menu contract
    // unchanged; only the movement keys above are new.
    event.preventDefault();
    const which = app.picker.which;
    app.picker = undefined;
    render();
    const back = document.querySelector('[data-date="' + which + '"]');
    if (back) back.focus();
  }
});

/* The panel opens on LC-227's own dates, read from the fixture the way the
   panel reads them from disk — an overdue due and a start nine days back, so
   the first thing a review sees is the rail doing its job rather than an empty
   one, and the field showing a past date carrying its year. */
function loadPanelDates() {
  const ticket = tickets()[0];
  for (const which of ["due", "start"]) {
    dateState[which].value = ticket[which];
    dateState[which].text = ticket[which]
      ? fieldDate(fromIso(ticket[which]), app.today)
      : "";
    dateState[which].refused = undefined;
  }
}
loadPanelDates();
render();
</script>
</body>
</html>
