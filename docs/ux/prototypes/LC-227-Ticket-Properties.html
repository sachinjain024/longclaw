<!doctype html>
<html lang="en" data-theme="light" data-lc-theme="clay">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC-227 — Ticket properties: type, due, start, estimate</title>

<!-- The app's own fonts, tokens and stylesheet. Nothing here re-implements a
     component that already exists: the panel, the cards, the menus and the
     settings pane below are the markup the app renders, wearing the rules
     `styles.css` already carries. What is new is in `#proposed`, and only
     that. -->
<link rel="stylesheet" href="../../design/foundations/proof/fonts.css">
<link rel="stylesheet" href="../../../apps/desktop/src/tokens/design-tokens.css">
<link rel="stylesheet" href="../../../apps/desktop/src/styles.css">

<!-- ====================================================================
     PROPOSED — the additions this ticket asks of `apps/desktop/src/styles.css`
     and `src/tokens/design-tokens.json`. This block is the CSS half of the
     review: everything in it is meant to land, as written, in the sections
     named beside each rule.
     ==================================================================== -->
<style id="proposed">
/* ---------------------------------------------------------------- tokens
 *
 * Two more pinned card heights. `boardGeometry.ts` says flatly that there is no
 * third; the second footer row makes four, and they multiply rather than add —
 * a second boolean over `cardStrides()`'s existing per-ticket choice, not a new
 * mechanism. `card-height-guard.mjs` adds all four up.
 *
 * The rail's width is a token because two rules read it: the grid column, and
 * the container query that decides whether there is a rail at all. */
:root {
  --lc-size-board-card-properties: 132px;
  --lc-size-board-card-properties-acknowledged: 160px;
  --lc-size-panel-rail: 232px;
}

/* ============================================================ ticket panel
 *
 * The panel splits below its header into a main column and a properties rail.
 *
 * The split is a **container query on the panel itself**, not a media query.
 * LC-238s makes the width a dragged, remembered number (`devicePreferences.ts`,
 * ADR 0012) — so "is there room for a rail" is a question about this box and
 * never about the window, and a viewport media query would put a rail in a
 * 560px panel on a 27-inch display. */
.ticket-panel {
  container-type: inline-size;
}

/* Everything under the title. One column until the rail fits, and the source
   order is main-then-rail so the fold below is a no-op rather than a reorder:
   under the query the properties land exactly where the meta grid stands
   today, above the description, which is where a 560px panel has always had
   them. */
.panel-body {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: var(--lc-space-4);
}

.panel-main {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: var(--lc-space-4);
}

.panel-rail {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: var(--lc-space-3);
}

/* One property. Below the query this is the meta grid's own row — 84px label
   column, 12px gap — because below the query it *is* the meta grid. The label
   keeps the grid's 11px/700 in both arrangements, so the two read as the same
   kind of thing however the panel is sized.
 *
 * It has to be stated **above** the container query rather than below it: the
 * two rules have the same specificity, so the last one in the sheet wins and
 * the query would lose. Written the other way round the rail rendered at
 * 660px+ with a 115px value cell — every control in it 100px narrower than
 * the rail it is in, and the estimate scale clipping its own labels. Nothing
 * about that reads as a source-order problem on screen, which is why it took
 * a run in WebKit to find. */
.rail-row {
  display: grid;
  min-width: 0;
  gap: var(--lc-space-3);
  grid-template-columns: 84px minmax(0, 1fr);
  align-items: center;
}

.rail-row > .rail-label {
  color: var(--lc-ink-3);
  font-size: 11px;
  font-weight: 700;
}

.rail-row .menu-trigger {
  max-width: 100%;
  justify-self: start;
}

/* The value cell has to be able to shrink; a menu trigger's own text is what
   would otherwise set the rail's width. */
.rail-row .menu-trigger > .menu-value {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 660px, which is 560 plus the rail plus the gap: the number says "as wide as
   the panel is today, and somewhere to put the rail" rather than naming a
   device. Under it there is no rail and the properties are stacked rows. */
@container (min-width: 660px) {
  .panel-body {
    display: grid;
    gap: var(--lc-space-5);
    grid-template-columns: minmax(0, 1fr) var(--lc-size-panel-rail);
    align-items: start;
  }

  /* The rule is the rail's left edge — the same hairline the panel already
     wears on its own left edge, doing the same job one level in. */
  .panel-rail {
    border-left: 1px solid var(--lc-line-soft);
    padding-left: var(--lc-space-5);
  }

  /* The name sits above its control, which is the one place the rail departs
     from the meta grid it replaces: 232px spending 84 on a label column leaves
     148 for a date field and its trigger, and the estimate scale does not fit
     in that at all. */
  .rail-row {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--lc-space-1);
  }

  /* The description no longer needs a rule over it. It is the first thing under
     the title now, with nothing between them to separate — and the rail's own
     hairline is the only line the split should draw. */
  .panel-main > .panel-section:first-child {
    border-top: 0;
    padding-top: 0;
  }
}

/* =========================================================== the date field
 *
 * One control with two ways in: a Field the caret sits in, and a calendar
 * trigger joined to its right edge. Joined rather than beside it, because they
 * are not two controls — the picker writes through the same normalisation the
 * typed grammar does, and a gap between them would say otherwise.
 *
 * The box is the field foundation's (`label input`, `.input`): 30px,
 * `--lc-line-strong`, control radius. It moves out to the wrapper so both
 * halves sit inside one border. */
.date-field {
  display: flex;
  height: var(--lc-size-control);
  align-items: center;
  border: 1px solid var(--lc-line-strong);
  border-radius: var(--lc-radius-control);
  background: var(--lc-surface);
}

.date-field input {
  min-width: 0;
  height: 100%;
  flex: 1;
  border: 0;
  padding: 0 0 0 10px;
  background: none;
  font: var(--lc-type-ui-weight) var(--lc-type-ui-size) var(--lc-type-ui-font);
}

.date-field input:focus-visible {
  box-shadow: none;
  outline: none;
}

/* The focus ring is the wrapper's, because the wrapper is the control. */
.date-field:focus-within {
  border-color: var(--lc-accent-human);
  box-shadow: var(--lc-focus-ring);
}

/* `tabIndex={-1}`, stated rather than defaulted (`tab-order-guard.mjs`): the
   field in front of it opens the picker with `↓`, and a stop of its own would
   be an extra press on every pass through a rail that has two dates in it. */
.date-trigger {
  display: inline-flex;
  width: 26px;
  height: 100%;
  flex: none;
  align-items: center;
  justify-content: center;
  border: 0;
  border-left: 1px solid var(--lc-line);
  padding: 0;
  color: var(--lc-ink-3);
  background: none;
  cursor: pointer;
}

.date-trigger:hover {
  color: var(--lc-ink-2);
  background: var(--lc-wash);
}

/* What is refused is not destroyed: the field keeps the text and reports that
   it did not resolve. `--lc-danger-border` and not `--lc-danger` — an
   unresolved value is a thing to finish typing, not an error the app is
   reporting. */
.date-field.unresolved {
  border-color: var(--lc-danger-border);
}

.date-note,
.date-echo {
  margin-top: 3px;
  font: var(--lc-type-micro-weight) var(--lc-type-micro-size) /
    var(--lc-type-micro-leading) var(--lc-type-micro-font);
}

/* The echo, and the reason the grammar is safe to ship as written: a form with
   no year means the nearest future occurrence, which on 5 Oct silently makes
   `28 Sep` next year. This is where that stops being silent. It appears while
   typing, as soon as the text resolves, and it is confirmation rather than
   validation — nothing goes red while a person is mid-word. */
.date-echo {
  color: var(--lc-ink-3);
}

.date-echo strong {
  color: var(--lc-ink-2);
  font-weight: 500;
}

.date-note {
  color: var(--lc-danger);
}

/* ========================================================== the date picker
 *
 * The app's first two-dimensional popover. The shell is `.menu-popover`'s,
 * which is why that class is on the element too — surface, hairline,
 * `--lc-shadow-menu`, the 120ms entrance. Only the contents are new, because
 * only the shape is. */
.date-picker {
  width: 236px;
  padding: var(--lc-space-2);
}

.date-picker-head {
  display: flex;
  height: 26px;
  align-items: center;
  gap: var(--lc-space-1);
  padding: 0 2px;
}

.date-picker-head strong {
  margin-right: auto;
  color: var(--lc-ink);
  font-size: 12.5px;
  font-weight: 600;
}

.date-step {
  display: inline-flex;
  width: 22px;
  height: 22px;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--lc-radius-tile);
  color: var(--lc-ink-3);
  background: none;
  cursor: pointer;
}

.date-step:hover {
  color: var(--lc-ink);
  background: var(--lc-wash);
}

.date-grid {
  display: grid;
  margin-top: var(--lc-space-1);
  grid-template-columns: repeat(7, 1fr);
}

/* Monday first, and derived rather than picked: the app has no locale to ask,
   the canonical on-disk form is ISO 8601, and ISO 8601's week starts on
   Monday. One convention already settled, used twice. */
.date-grid .dow {
  padding-bottom: 4px;
  color: var(--lc-ink-3);
  font:
    var(--lc-type-kbd-weight) var(--lc-type-kbd-size) var(--lc-type-kbd-font);
  text-align: center;
  text-transform: uppercase;
}

.date-cell {
  height: 26px;
  border: 0;
  border-radius: var(--lc-radius-tile);
  color: var(--lc-ink);
  background: none;
  font-family: var(--lc-font-mono);
  font-size: 11.5px;
  cursor: pointer;
}

.date-cell:hover {
  background: var(--lc-wash);
}

.date-cell.adjacent {
  color: var(--lc-ink-disabled);
}

/* Today and the current value are two different marks, because a ticket due
   today wears both on one cell: today is a ring, the value is a fill. */
.date-cell.now {
  box-shadow: inset 0 0 0 1px var(--lc-line-strong);
}

.date-cell.picked {
  color: var(--lc-on-accent-human);
  background: var(--lc-accent-human);
  font-weight: 600;
}

/* The grid is one tab stop and the cursor moves inside it, as a board column's
   cards do (`rovingFocus.ts`): 42 tab stops in a popover would be a month you
   have to Tab across. */
.date-cell:focus-visible {
  box-shadow: var(--lc-focus-ring);
  outline: none;
}

/* Clearing is a first-class act and is not the same as never set: on disk both
   are no key, so the distinction lives in the edit command. This row is the
   pointer's way to do what emptying the field does. */
.date-clear {
  display: block;
  width: 100%;
  margin-top: var(--lc-space-1);
  border: 0;
  border-top: 1px solid var(--lc-line-soft);
  padding: 7px 0 3px;
  color: var(--lc-ink-3);
  background: none;
  font-size: var(--lc-type-small-size);
  text-align: left;
  cursor: pointer;
}

.date-clear:hover {
  color: var(--lc-ink);
}

/* ======================================================= the estimate scale
 *
 * The segment the appearance row already uses, because the app has one control
 * for "pick one of a small fixed set, laid out horizontally" and a second one
 * would be a second thing to learn. In the app this joins
 * `.view-segment, .appearance-segment`'s selector list rather than restating
 * its rules; it is written out here so the file stands alone. */
.scale-segment {
  /* `flex`, not `inline-flex`: the segment is the row's control and takes the
     cell, the way the date field beside it does. As `inline-flex` it shrank to
     fit and then handed its children `flex: 1` of nothing — six segments 16px
     wide, each clipping its own label, in a rail with 90px going spare. */
  display: flex;
  overflow: hidden;
  max-width: 100%;
  border: 1px solid var(--lc-line-strong);
  border-radius: var(--lc-radius-control);
}

/* No `min-width: 0` here, deliberately. `flex: 1` bases every segment at zero
   and the automatic minimum is the only thing holding them at the width of the
   word inside them; taking it away is what let `XS` render as `X`. */
.scale-segment button {
  height: 28px;
  flex: 1;
  border: 0;
  padding: 0 var(--lc-space-1);
  color: var(--lc-ink-2);
  background: transparent;
  font-family: var(--lc-font-mono);
  font-size: 11px;
  cursor: pointer;
}

.scale-segment button + button {
  border-left: 1px solid var(--lc-line-strong);
}

.scale-segment button:hover {
  background: var(--lc-wash);
}

.scale-segment button.selected {
  color: var(--lc-ink);
  background: var(--lc-line-soft);
  font-weight: 600;
}

/* The leading `—`. Absent is a value a scale has to be able to say, and the
   dash is the app's existing word for it: `priority: none` draws this glyph
   already (`.priority-dash`). Without it the only way back out of an estimate
   is a menu the scale does not have. */
.scale-segment button.none {
  width: 26px;
  flex: none;
  color: var(--lc-priority-none);
}

/* Duration is a number and a unit rather than a scale: the field foundation,
   then the menu trigger every other rail row wears. */
.estimate-duration {
  display: flex;
  gap: var(--lc-space-2);
}

.estimate-duration .input {
  width: 68px;
  flex: none;
}

.estimate-duration .menu-trigger {
  min-width: 0;
  flex: 1;
}

/* A value written under another system. It is the ticket's own data and this
   configuration cannot read it — invariant 16 exactly — so it is drawn in full
   and only marked as unreadable, the way an undefined label slug is. */
.estimate-foreign {
  display: inline-flex;
  height: var(--lc-size-chip);
  align-items: center;
  border: 1px dashed var(--lc-line-strong);
  border-radius: var(--lc-radius-control);
  padding: 0 8px;
  color: var(--lc-ink-3);
  font-family: var(--lc-font-mono);
  font-size: 11px;
}

/* ==================================================== the card's second row
 *
 * The footer never wraps and holds two chips — one beside a checklist fraction
 * — so an always-visible date would cost a label slot on every ticket that has
 * one. The footer gains a row instead, and the date does not compete for the
 * existing one.
 *
 * It sits *above* that footer: the escalating chip is what the eye is meant to
 * catch, so it goes as close to the title as the card can put it, and the label
 * row keeps the last line it has always had.
 *
 * One line, never wrapping, exactly like the row under it — which is what keeps
 * the card to four pinned heights however many values land in it. */
.ticket-properties {
  display: flex;
  height: 20px;
  gap: var(--lc-space-2);
  align-items: center;
  overflow: hidden;
  color: var(--lc-ink-3);
  font-family: var(--lc-type-code-font);
  font-size: 10.5px;
  font-weight: 500;
}

/* Presence is a boolean off `IndexedTicket` plus the project's configuration —
   "has a value for an enabled second-row property" — and never a reading of the
   rung. A height decided from the rung would change at midnight with no file
   write, shifting every column's offsets under a scrolled board. */
.ticket-row.has-properties {
  height: var(--lc-size-board-card-properties);
}

.ticket-row.has-properties.acknowledged {
  height: var(--lc-size-board-card-properties-acknowledged);
}

/* The four rungs. Only overdue takes a hue, which is `PriorityGlyph`'s rule
   rather than a new one — monochrome except at the top, because a priority
   conveyed by colour alone is one half the people looking at the board cannot
   read. Every rung is legible with the colour removed: the words differ at
   every one of them. */
.due-chip.overdue {
  color: var(--lc-danger);
  font-weight: 600;
}

.due-chip.today {
  color: var(--lc-ink);
  font-weight: 600;
}

/* Today stays **monochrome and emphasised**, settled in review 2026-09-08 after
   trying it in `--lc-danger`. Sharing overdue's hue read as a second overdue at
   a glance — the two loudest things on the board became the same colour, and
   the distinction moved entirely into words that are 11px. Giving it a third
   colour was never available: agent green belongs to agents and `--lc-warn` is
   the unattributed external change (`styles.css:139-140`), which LC-148 was the
   bug of colliding with. The visibility it needed came from the key row
   instead. */

.due-chip.approaching {
  color: var(--lc-ink-2);
}

.due-chip.beyond {
  color: var(--lc-ink-3);
}

/* The separator between the row's mono values, which is the first footer's own
   grammar one row up: mono values first, chips after. */
.ticket-properties .sep {
  color: var(--lc-line-strong);
}

/* ---- the due in the key row, immediately before the priority glyph ----
 *
 * The alternative placement, and the cheap one: `.card-top` is pinned at 16px
 * whatever is in it, so a date up here costs **no height at all** — no second
 * footer row, no new pinned heights, no fourth case for `cardStrides()`.
 *
 * It buys that by showing only the escalated rungs. The key row is the card's
 * urgency line — it already holds the priority glyph — and a date a fortnight
 * out has no business on it, so Beyond shows nowhere on the card in this mode.
 * Whether that is a loss is the question this placement is here to answer.
 *
 * `margin-left: auto` on the glyph is what already holds it at the far end, so
 * this needs nothing to sit before it — and it must not be `flex: 1`, or a card
 * with no date would move the glyph. */
.card-top .due-chip {
  flex: none;
  overflow: hidden;
  /* The key row's own voice — `.ticket-key` is 11px mono, and this is the same
     line. Stated rather than inherited: `.ticket-properties` sets the mono face
     for the footer copy, and nothing sets it up here, so without this the date
     falls back to the card's 13px UI font and renders larger than the key it
     stands beside. Loud, but loud by accident and in the wrong typeface.
     Emphasis is the hue and the weight's job; the size stays the row's. */
  font-family: var(--lc-type-code-font);
  font-size: 11px;
  /* One line inside a 16px row, and never the thing that makes it two. */
  line-height: 14px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* The key is what gives way when a long date and a long key meet, because the
   date is the news and the key is on screen in four other places. */
.card-top:has(.due-chip) .ticket-key {
  overflow: hidden;
  min-width: 0;
  text-overflow: ellipsis;
}

/* The right-aligned variation: the date crosses the row and stands immediately
   left of the priority glyph, so the two urgency marks are one object at the
   far edge and the key keeps the left edge to itself.
 *
 * The auto margin has to *move* rather than be added. `.card-top`'s existing
 * rule puts `margin-left: auto` on the glyph; a second auto on the date would
 * split the free space between them and park the date in the middle of the row,
 * which is neither alignment. So the date takes the auto and the glyph gives it
 * back — the 8px between them is then `.card-top`'s own gap.
 *
 * `:has(.due-chip)` on the second rule is load-bearing, not tidiness. Handing
 * the auto over unconditionally takes it away from the glyph on a card that has
 * **no due date** and gives it to nothing, so the priority glyph walks back up
 * the row and sits against the key — 200px from the edge its neighbours' sit
 * on. Every card in the fixture has a due except one, which is exactly how a
 * defect like this ships. */
.card-top.due-right .due-chip {
  margin-left: auto;
}

.card-top.due-right:has(.due-chip) .priority-glyph,
.card-top.due-right:has(.due-chip) .priority-chip {
  margin-left: 0;
}

/* Type on the card is a chip, because that is what it is everywhere else — the
   same slug/name/colour registry a label is, drawn the way a label is drawn.
   Held to the far end so the row's mono half stays flush left whether or not
   there is a type on it. */
.ticket-properties .label-chip {
  margin-left: auto;
}

/* The list row's due follows the labels and stays on one line. */
.list-row .due-chip {
  flex: none;
  white-space: nowrap;
}

/* ============================================= the settings Properties pane
 *
 * One block per property: a checkbox that turns it on, whatever it has to
 * configure under that, and — while it is off — the count of tickets still
 * carrying a value, which is then the only place that fact is visible. */
.property-block {
  margin-top: var(--lc-space-4);
  border-top: 1px solid var(--lc-line-soft);
  padding-top: var(--lc-space-4);
}

.settings-section > .property-block:first-of-type {
  border-top: 0;
  padding-top: 0;
}

.property-head {
  display: flex;
  gap: var(--lc-space-2);
  align-items: center;
  color: var(--lc-ink);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* The checkbox pair the checklist rows draw, on a third selector — in the app
   this joins `.checklist-row input[type="checkbox"], .create-more input`
   rather than drawing a second check. WKWebView paints no pseudo-elements on
   `<input>`, so the tick is the two gradient strokes `styles.css` already
   builds. */
.property-head input {
  width: var(--lc-size-checkbox);
  height: var(--lc-size-checkbox);
  flex: none;
  margin: 0;
  padding: 0;
  appearance: none;
  border: var(--lc-border-ring) solid var(--lc-check-border);
  border-radius: var(--lc-radius-kbd);
  background-color: var(--lc-surface);
  cursor: pointer;
}

/* The tick is the short stroke and the long one, at the sizes and offsets that
   make them meet — `styles.css:3289-3313` verbatim. Written from memory it drew
   a chevron: the two gradients are `45deg` and `135deg`, not `45` and `-45`,
   and the offsets are what put the join in the right place. This is exactly the
   argument for joining the existing selector list in the app rather than
   copying the rule, and the copy here is the file standing alone. */
.property-head input:checked {
  border-color: var(--lc-ink-3);
  background-color: var(--lc-ink-3);
  background-image:
    linear-gradient(
      45deg,
      transparent calc(50% - 0.8px),
      var(--lc-surface) calc(50% - 0.8px) calc(50% + 0.8px),
      transparent calc(50% + 0.8px)
    ),
    linear-gradient(
      135deg,
      transparent calc(50% - 0.8px),
      var(--lc-surface) calc(50% - 0.8px) calc(50% + 0.8px),
      transparent calc(50% + 0.8px)
    );
  background-repeat: no-repeat;
  background-position:
    1.6px 5.6px,
    4.4px 2.4px;
  background-size:
    3.4px 3.4px,
    6.2px 6.2px;
}

/* What is still on disk while the property is off. It is the count the write
   feedback said once, going on saying it: the effect of disabling is invisible
   everywhere else, and a person could reasonably conclude the dates were
   deleted.
 *
 * Beside the name, not at the far edge. `margin-left: auto` sent it 800px
 * across a 620px-wide pane, which is the defect D-3D already named one surface
 * up — the panel's section count used to do the same, and "a number a whole
 * heading away from the word it counts reads as belonging to nothing"
 * (`styles.css`, `.panel-section h3`). The same fix: it reads as part of the
 * row's own group. */
.property-state {
  color: var(--lc-ink-3);
  font:
    400 var(--lc-type-micro-size) / var(--lc-type-micro-leading)
    var(--lc-type-micro-font);
}

/* Indented to the checkbox's text, so the configuration reads as belonging to
   the property rather than as the next thing down the pane. */
.property-config {
  margin-top: var(--lc-space-3);
  padding-left: calc(var(--lc-size-checkbox) + var(--lc-space-2));
}

.property-config > * + * {
  margin-top: var(--lc-space-3);
}

.property-note {
  color: var(--lc-ink-3);
  font-size: 11.5px;
  line-height: 1.55;
}

.property-inline {
  display: flex;
  gap: var(--lc-space-2);

<script>
/* ====================================================================
   LC-227 — the prototype behind six checklist rows.
   ====================================================================

   Five scenes, one question each:

     1  panel     the properties rail, and the description moved to the top
     2  rungs     the four due rungs and their treatments, in both appearances
     3  card      the second footer row: what it holds, and the four heights
     4  estimate  the control under each of the three systems
     5  settings  the Properties pane, including a property switched off

   Everything drawn below is the app's own markup wearing the app's own CSS.
   The only new rules are in `#proposed`, and the only new logic is this file's
   `parseDate()`, `rung()` and `cardHeight()` — the three pieces the
   implementation rows have to write for real.
   ==================================================================== */

/* ------------------------------------------------------------- vocabulary */

const STATUSES = [
  ["backlog", "Backlog"], ["todo", "Todo"], ["in_progress", "In Progress"],
  ["in_review", "In Review"], ["done", "Done"], ["canceled", "Canceled"],
];
const PRIORITIES = [
  ["urgent", "Urgent"], ["p1", "P1"], ["p2", "P2"], ["p3", "P3"],
  ["p4", "P4"], ["none", "None"],
];
const FIBONACCI = ["1", "2", "3", "5", "8", "13"];
const TSHIRT = ["xs", "s", "m", "l", "xl"];
const UNITS = [["m", "minutes"], ["h", "hours"], ["d", "days"], ["w", "weeks"]];

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const statusName = (id) => (STATUSES.find((s) => s[0] === id) || [])[1];
const priorityName = (id) => (PRIORITIES.find((p) => p[0] === id) || [])[1];

/* ------------------------------------------------------------- the project
 *
 * One project's `longclaw.yaml`, as the properties block would carry it
 * (`file_format.md` § The `properties` block). Every scene below is gated on
 * this object, because everything in the app will be — including, in the
 * settings scene, turning a property off while tickets carry values.
 *
 * All four are **on** here, which no real project starts as: they ship all-off
 * so that no existing project changes and no card gains a row it did not ask
 * for. This is the everything-enabled case because it is the one worth looking
 * at.
 */
const project = {
  labels: {
    storage:  { name: "Storage", color: "blue" },
    frontend: { name: "Frontend", color: "cyan" },
    format:   { name: "Format", color: "amber" },
    release:  { name: "Release Blocker", color: "red" },
    design:   { name: "Design", color: "orange" },
  },
  properties: {
    type: {
      enabled: true,
      values: {
        bug:     { name: "Bug", color: "red" },
        feature: { name: "Feature", color: "cyan" },
        chore:   { name: "Chore", color: "gray" },
        docs:    { name: "Docs", color: "blue" },
        spike:   { name: "Spike", color: "purple" },
      },
    },
    due:   { enabled: true, attention_days: 7 },
    start: { enabled: true },
    estimate: {
      enabled: true,
      system: "duration",
      values: {
        xs: { name: "XS", color: "gray" }, s: { name: "S", color: "gray" },
        m:  { name: "M", color: "gray" },  l: { name: "L", color: "gray" },
        xl: { name: "XL", color: "gray" },
      },
      hours_per_day: 8,
      days_per_week: 5,
    },
  },
};

/**
 * What the driver holds. `today` is injected rather than read from the clock,
 * which is the seam `listRow.ts:41` already threads as `now` — and the reason
 * the rungs are reviewable at all: the driver's `+ day` moves it.
 */
const app = {
  scene: "panel",
  today: new Date(2026, 8, 8),      // Tue 8 Sep 2026
  panelWidth: 800,
  rowAbove: true,                   // the properties row above the label footer
  secondRow: "none",                // none | estimate | everything
  /* Settled in review: the date crosses the key row and stands immediately left
     of the priority glyph, so the two urgency marks read as one object at the
     far edge and the key keeps the left edge to itself. */
  overdueWash: false,               // the alternative overdue treatment
  estimateControl: "segment",       // segment | menu
  echo: true,                       // the date field's resolved-day echo
  menu: undefined,
  picker: undefined,
  toastTimer: undefined,
};

/* ------------------------------------------------------------------- dates
 *
 * A date is a *day*. Everything here works in local calendar days and never in
 * instants, which is the whole reason `due` is not RFC 3339: a ticket due
 * 28 Sep goes overdue in Tokyo before it does in California, and that is
 * correct for a day-valued date rather than a defect.
 */

function startOfDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}
function addDays(date, days) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
}
function addMonths(date, months) {
  const first = new Date(date.getFullYear(), date.getMonth() + months, 1);
  const lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(date.getDate(), lastDay));
}
/** Whole calendar days between two days, signed. */
function daysBetween(from, to) {
  return Math.round((startOfDay(to) - startOfDay(from)) / 86400000);
}
/** The canonical on-disk form, and the only form the CLI accepts. */
function iso(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
}
function fromIso(text) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);
  if (!m) return undefined;
  const date = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  // A real day, not a rolled-over one: `2026-02-31` is refused rather than
  // silently becoming 3 March.
  if (date.getMonth() !== Number(m[2]) - 1 || date.getDate() !== Number(m[3])) return undefined;
  return date;
}

const MONTHS = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December",
];
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

/**
 * Display is the input's mirror: `28 Sep`, and `28 Sep 2027` when the year is
 * not the current one — so what is displayed is always something the grammar
 * accepts. Day-then-month is a choice rather than a deduction, and it is
 * consistent with an app that hardcodes its English everywhere else.
 *
 * This is what a **card** shows, and a card is only ever read.
 */
function displayDate(date, now) {
  const month = MONTHS[date.getMonth()].slice(0, 3);
  const year = date.getFullYear() === now.getFullYear() ? "" : " " + date.getFullYear();
  return date.getDate() + " " + month + year;
}

/**
 * What a **field** shows, which is not the same thing — and this is the one
 * correction the prototype makes to the settled grammar.
 *
 * "What is displayed is always something the grammar accepts" is true of
 * `displayDate` and it is not enough, because a form with no year means the
 * nearest *future* occurrence. A ticket due 5 Sep 2026, opened on 8 Sep 2026,
 * renders `5 Sep` — which the grammar accepts and reads as **5 Sep 2027**. The
 * field is therefore showing a string that does not mean the day it is showing
 * it for, and the first person to retype what is already in front of them
 * moves the date a year without being told.
 *
 * So a field carries the year whenever the date would not round-trip without
 * it: when it is not in the current year, **or when it is in the past**. A card
 * needs none of this, because nobody types into a card.
 */
function fieldDate(date, now) {
  const roundTrips =
    date.getFullYear() === now.getFullYear() && daysBetween(now, date) >= 0;
  const month = MONTHS[date.getMonth()].slice(0, 3);
  return date.getDate() + " " + month + (roundTrips ? "" : " " + date.getFullYear());
}

/** The echo's fuller form, which is what makes the year rule visible. */
function echoDate(date) {
  return WEEKDAYS[date.getDay()] + " " + date.getDate() + " " +
    MONTHS[date.getMonth()].slice(0, 3) + " " + date.getFullYear();
}

/* --------------------------------------------------------- the date grammar
 *
 * One rule generates all of it: **the month is named, or the order is ISO.**
 *
 * A date input's worst failure is not refusing something a person meant — they
 * see that and retype it — but silently storing a different day from the one
 * they meant. So every form that would need a locale to resolve is refused,
 * and everything a named month makes unambiguous is accepted.
 *
 * Returns one of:
 *   { kind: "empty" }                    the field was cleared
 *   { kind: "date", date }               it resolved
 *   { kind: "refused", why }             it did not, and `why` is what to say
 *
 * `why` is a whole sentence rather than a code, because it is the only thing
 * the person sees and each refusal has a different next move.
 */
function parseDate(raw, now) {
  const text = String(raw).trim().replace(/\s+/g, " ").toLowerCase();
  if (!text) return { kind: "empty" };

  // The two words a person types *instead* of thinking, rather than words that
  // ask the app to think. Resolved against the same injected `now` the rungs
  // use, so a prototype that moves "today" moves these with it.
  if (text === "today") return { kind: "date", date: startOfDay(now) };
  if (text === "tomorrow") return { kind: "date", date: addDays(startOfDay(now), 1) };

  // Anything carrying a time. Accepting one only to drop it would store
  // something other than what was typed.
  if (/\d\s*(?::\d|am\b|pm\b)|\bt\d{2}:/i.test(text))
    return { kind: "refused", why: "A due date is a day, with no time on it." };

  const isoDate = fromIso(text);
  if (isoDate) return { kind: "date", date: isoDate };
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(text))
    return { kind: "refused", why: "That day does not exist. ISO dates are YYYY-MM-DD." };

  // All-numeric forms that are not ISO. This is the rule's whole reason: the
  // app has no locale — there is no `Intl` call anywhere in `apps/desktop/src`
  // — so nothing in it can say whether `3/4` is March or April, and a guess
  // would be silently wrong for half the world.
  if (/^[\d]+[\s\-/.][\d\s\-/.]*$/.test(text))
    return { kind: "refused", why: "Numeric dates are read as YYYY-MM-DD only. Try 28 Sep, or 2026-09-28." };

  const sep = "[\\s\\-/]+";
  const dayPart = "(\\d{1,2})(?:st|nd|rd|th)?";
  const monthPart = "([a-z]+)";
  const yearPart = "(\\d{2,4})";

  let day, monthName, year;
  let m = new RegExp("^" + dayPart + sep + monthPart + "(?:,?" + sep + yearPart + ")?$").exec(text);
  if (m) { day = m[1]; monthName = m[2]; year = m[3]; }
  if (!m) {
    m = new RegExp("^" + monthPart + sep + dayPart + "(?:,?" + sep + yearPart + ")?$").exec(text);
    if (m) { monthName = m[1]; day = m[2]; year = m[3]; }
  }

  if (!m) {
    // A month with no day, and the weekday/relative family, each named so the
    // field says what to do next rather than only that it failed.
    if (MONTHS.some((name) => name.toLowerCase() === text || name.toLowerCase().slice(0, 3) === text))
      return { kind: "refused", why: "Which day? A month on its own is not a date." };
    if (/^(mon|tues?|wed|thur?s?|fri|sat|sun)/.test(text) || /^(next|last|in )/.test(text))
      return { kind: "refused", why: "Dates are typed, not computed. Try 28 Sep, or use the calendar." };
    return { kind: "refused", why: "Not a date this reads. Try 28 Sep, Sep 28, or 2026-09-28." };
  }

  const monthIndex = MONTHS.findIndex(
    (name) => name.toLowerCase() === monthName || name.toLowerCase().slice(0, 3) === monthName,
  );
  if (monthIndex < 0)
    return { kind: "refused", why: "Not a month this reads. Try Sep or September." };

  // Two-digit years. Unambiguous on its own, and the habit that produces
  // `9/28/26`.
  if (year !== undefined && year.length !== 4)
    return { kind: "refused", why: "Write the year in full — 28 Sep 2026." };

  const dayNumber = Number(day);
  const resolve = (whichYear) => {
    const date = new Date(whichYear, monthIndex, dayNumber);
    return date.getMonth() === monthIndex && date.getDate() === dayNumber ? date : undefined;
  };

  if (year !== undefined) {
    const exact = resolve(Number(year));
    return exact
      ? { kind: "date", date: exact }
      : { kind: "refused", why: "That day does not exist in that month." };
  }

  // A form with no year means the nearest future occurrence, and **today counts
  // as future**: `28 Sep` typed on 28 Sep is today, not next year. That is the
  // one boundary the rule has to state itself. Typed on 5 Oct it means next
  // year, and that is the price — the past is reachable by typing the year,
  // and it is both the rarer direction and the riskier one, because a date
  // that silently lands in the past reads as an overdue ticket nobody created.
  const thisYear = resolve(now.getFullYear());
  if (thisYear && daysBetween(now, thisYear) >= 0) return { kind: "date", date: thisYear };
  const nextYear = resolve(now.getFullYear() + 1);
  if (nextYear) return { kind: "date", date: nextYear };
  // 29 Feb in a year with no 29 Feb: walk forward to one that has it rather
  // than refusing a day that plainly exists.
  for (let ahead = 2; ahead <= 8; ahead += 1) {
    const later = resolve(now.getFullYear() + ahead);
    if (later) return { kind: "date", date: later };
  }
  return { kind: "refused", why: "That day does not exist in that month." };
}

/* -------------------------------------------------------------- the rungs
 *
 * Four, and the treatment escalates with the date. The date itself is the
 * weakest rung — visible, but not engaging when it is a fortnight out — and
 * both what the chip *says* and how it is drawn sharpen as the day approaches.
 *
 * The rungs stand down on a ticket that is done, canceled or archived: a
 * finished ticket that was due last week is not overdue, it is finished, and a
 * Done column drawn in `--lc-danger` teaches people to ignore the colour that
 * was supposed to mean something. Status is row data, so this changes the
 * treatment and never the height.
 */
function rung(due, now, attentionDays, status, archived) {
  if (!due) return undefined;
  if (archived || status === "done" || status === "canceled") return "beyond";
  const days = daysBetween(now, due);
  if (days < 0) return "overdue";
  if (days === 0) return "today";
  // `0` is legal and empties the approaching rung, leaving Today and Beyond.
  if (days <= attentionDays) return "approaching";
  return "beyond";
}

/**
 * What the chip says. The chip is not the date field and does not have to
 * mirror the grammar: nobody types into a card, so it is free to say the
 * shortest true thing, and `in 3d` reuses the relative vocabulary
 * `describeAge` already speaks rather than inventing a second one.
 */
function rungText(due, now, which) {
  const days = daysBetween(now, due);
  if (which === "overdue") return Math.abs(days) + "d overdue";
  if (which === "today") return "Today";
  if (which === "approaching") return "in " + days + "d";
  return displayDate(due, now);
}

/* ------------------------------------------------------------- estimates */

/**
 * An estimate is **always a string**, and what it may hold depends on the
 * system the project is on. A value written under another system is not
 * converted and not dropped: it reads as unreadable here and is legible again
 * the moment the project switches back (`file_format.md` invariant 16).
 */
function readEstimate(value, config) {
  if (!value) return undefined;
  if (config.system === "tshirt")
    return config.values[value] ? { kind: "known", text: config.values[value].name } : { kind: "foreign", text: value };
  if (config.system === "fibonacci")
    return FIBONACCI.includes(value) ? { kind: "known", text: value } : { kind: "foreign", text: value };
  const m = /^(\d+(?:\.\d+)?)([mhdw])$/.exec(value);
  return m ? { kind: "known", text: value, amount: Number(m[1]), unit: m[2] } : { kind: "foreign", text: value };
}

/** Minutes, so `4h` and `1d` can be compared. The conversion is the project's. */
function estimateMinutes(value, config) {
  const m = /^(\d+(?:\.\d+)?)([mhdw])$/.exec(value || "");
  if (!m) return undefined;
  const amount = Number(m[1]);
  const hour = 60;
  const day = config.hours_per_day * hour;
  return { m: amount, h: amount * hour, d: amount * day, w: amount * config.days_per_week * day }[m[2]];
}

/* ------------------------------------------------------------ card heights
 *
 * `boardGeometry.ts` does not measure a card and cannot afford to: a
 * 5,000-ticket board is 71ms a frame with every card in the document and 21ms
 * with only the visible ones, and windowing means knowing every card's offset
 * before any of them exist. So the height is arithmetic over **row data**, and
 * this function is the whole of the change LC-227 makes to it.
 *
 * The thing to watch during a run: press `+ day` in the driver until a card
 * escalates from Beyond to Today. The colour changes and **the height does
 * not**, because the boolean below asks whether the ticket *has* a value for
 * an enabled second-row property and never what rung it is on. Deciding it
 * from the rung would change card heights at midnight, with no file write,
 * shifting every column's offsets under a scrolled board.
 */
const CARD_HEIGHT = 108;
const ACKNOWLEDGED_CARD_HEIGHT = 136;
const CARD_HEIGHT_PROPERTIES = 132;
const ACKNOWLEDGED_CARD_HEIGHT_PROPERTIES = 160;

/**
 * Note what this asks and what it does not. It reads the ticket's *values* and
 * the project's configuration — never a rung — because the answer is a height.
 *
 * Due is not in it. Since the key row carries the date, a project whose only
 * enabled property is Due gets no second row on any card and keeps today's
 * geometry exactly — which is the largest thing the key-row placement buys, and
 * it is invisible until you look at the heights.
 */
function hasSecondRow(ticket) {
  const properties = project.properties;
  if (app.secondRow === "none") return false;
  if (properties.estimate.enabled && ticket.estimate) return true;
  if (app.secondRow === "everything" && properties.type.enabled && ticket.type) return true;
  return false;
}

function cardHeight(ticket) {
  const second = hasSecondRow(ticket);
  if (ticket.acknowledged) return second ? ACKNOWLEDGED_CARD_HEIGHT_PROPERTIES : ACKNOWLEDGED_CARD_HEIGHT;
  return second ? CARD_HEIGHT_PROPERTIES : CARD_HEIGHT;
}

/* ------------------------------------------------------------------ tickets
 *
 * Six tickets, dated relative to the driver's `today` so a run that moves the
 * day moves them all. Two of them carry no due date at all, which is what
 * gives the card scene its short cards to stand the tall ones beside.
 */
function tickets() {
  const day = (offset) => iso(addDays(app.today, offset));
  return [
    { key: "LC-227", title: "Add other fields to tickets like due date, start date, estimate, type",
      status: "in_progress", priority: "urgent", labels: ["release", "frontend"],
      type: "feature", due: day(-3), start: day(-9), estimate: "2d",
      checked: 13, items: 34 },
    { key: "LC-238s", title: "The ticket panel remembers a width you drag it to",
      status: "todo", priority: "p1", labels: ["frontend"],
      type: "feature", due: day(0), start: undefined, estimate: "4h",
      checked: 0, items: 0 },
    { key: "LC-193", title: "The checklist add-row scrolls out from under the caret",
      status: "todo", priority: "p2", labels: ["frontend", "design"],
      type: "bug", due: day(3), start: undefined, estimate: "1.5d",
      checked: 2, items: 5, acknowledged: true, actor: "claude-code · 40s ago" },
    { key: "LC-241", title: "Conformance fixtures for every property, enabled and disabled",
      status: "todo", priority: "p3", labels: ["format"],
      type: "chore", due: day(20), start: undefined, estimate: "30m",
      checked: 0, items: 0 },
    { key: "LC-66", title: "Generated AGENTS.md churns on every project change",
      status: "backlog", priority: "p2", labels: ["storage"],
      type: "bug", due: undefined, start: undefined, estimate: "1w",
      checked: 0, items: 0 },
    { key: "LC-149", title: "The content header breaks in half mid-write",
      status: "done", priority: "p1", labels: ["design"],
      type: "bug", due: day(-11), start: undefined, estimate: undefined,
      checked: 4, items: 4 },
  ];
}

/* ------------------------------------------------------------------ glyphs
 *
 * `StatusDot.tsx`, `PriorityGlyph.tsx` and `LabelChip.tsx`, as the markup they
 * render. Nothing here decides anything — they are here so the scenes can draw
 * a real card rather than a picture of one.
 */

function statusDot(id) {
  const open = id === "todo" || id === "backlog";
  const dash = id === "backlog" ? ' stroke-dasharray="2.1 2.5"' : "";
  return '<svg class="status-dot status-' + id.replace(/_/g, "-") + '" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="' + (open ? "none" : "currentColor") + '" stroke="currentColor" stroke-width="1.6"' + dash + '/></svg>';
}

function priorityGlyph(id, small) {
  const cls = small ? " small" : "";
  if (id === "none")
    return '<span class="priority-chip none' + cls + '" aria-hidden="true"><svg class="priority-dash" width="9" height="2" viewBox="0 0 9 2" aria-hidden="true"><rect y="0.2" width="9" height="1.6" rx="0.8"/></svg></span>';
  if (id === "urgent")
    return '<svg class="priority-glyph" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3"/><rect class="mark" x="6.25" y="3.4" width="1.5" height="4.6" rx="0.75"/><rect class="mark" x="6.25" y="9.2" width="1.5" height="1.5" rx="0.75"/></svg>';
  return '<span class="priority-chip' + cls + '" aria-hidden="true">' + id.toUpperCase() + "</span>";
}

const chevron = '<svg class="menu-chevron" width="11" height="11" viewBox="0 0 14 14" aria-hidden="true"><path d="M4.5 2.5 L9.5 7 L4.5 11.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* The calendar the date field's trigger wears. Twelve lines and no month name
   in it — the app draws no other calendar, so this glyph is the whole of the
   affordance. */
const calendarGlyph = '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="2.5" width="11" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 5.5 H12.5 M4.5 1.5 V3.5 M9.5 1.5 V3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';

function labelChip(slug, small) {
  const def = project.labels[slug];
  const cls = "label-chip" + (small ? " small" : "") + (def ? "" : " undefined-slug");
  const color = def ? def.color : "gray";
  return '<span class="' + cls + '"><span class="label-dot label-' + color + (small ? " small" : "") + '" aria-hidden="true"></span>' + esc(def ? def.name : slug) + "</span>";
}

/** A type value is a label in every respect but exclusivity, so it is drawn as
    one — the same registry shape, the same chip, the same fallback for a slug
    the project no longer defines. */
function typeChip(slug, small) {
  const def = project.properties.type.values[slug];
  const cls = "label-chip" + (small ? " small" : "") + (def ? "" : " undefined-slug");
  const color = def ? def.color : "gray";
  return '<span class="' + cls + '"><span class="label-dot label-' + color + (small ? " small" : "") + '" aria-hidden="true"></span>' + esc(def ? def.name : slug) + "</span>";
}

/* --------------------------------------------------------------- the card */

/**
 * The card's due, and the only place a rung is read.
 *
 * Settled 2026-09-08 in review: **the key row, and whenever the ticket has a
 * due at all** — every rung, not only the escalated ones. Two consequences fall
 * out of that pair, and they are why it is the answer:
 *
 * - It costs **no height**. `.card-top` is pinned at 16px whatever is in it, so
 *   there are no new pinned heights, no fourth case for `cardStrides()`, and
 *   `card-height-guard.mjs` keeps the two invariants it has. Due is no longer a
 *   second-footer-row property at all.
 * - Presence is back to **pure row data** — "has a due, and the property is
 *   enabled" — with no reading of the rung in it. Showing only the escalated
 *   rungs would have made presence rung-derived, which is safe in a fixed-height
 *   row but is one more thing to have to know. Showing it always is simpler and
 *   answers "where is that date I set" without opening the ticket.
 *
 * The rung still decides the *word* and the *weight*, which change at midnight
 * and move nothing.
 */
function dueChip(ticket, archived) {
  const due = fromIso(ticket.due);
  if (!due) return "";
  const which = rung(due, app.today, project.properties.due.attention_days, ticket.status, archived);
  const wash = app.overdueWash && which === "overdue" ? " washed" : "";
  return '<span class="due-chip ' + which + wash + '">' + esc(rungText(due, app.today, which)) + "</span>";
}

/** Whether the key row carries this ticket's due. Row data, and nothing else. */
function dueOnCard(ticket) {
  return Boolean(project.properties.due.enabled && ticket.due);
}

/**
 * The second footer row, which due has now left entirely. What is left in it is
 * estimate and type — and if a project enables neither, no card has one and the
 * board keeps today's two heights.
 */
function secondRowHTML(ticket) {
  if (!hasSecondRow(ticket)) return "";
  const parts = [];
  if (app.secondRow !== "none" && project.properties.estimate.enabled && ticket.estimate) {
    const read = readEstimate(ticket.estimate, project.properties.estimate);
    parts.push('<span class="estimate-value">' + esc(read.kind === "known" ? read.text : ticket.estimate) + "</span>");
  }
  if (app.secondRow === "everything" && project.properties.type.enabled && ticket.type)
    parts.push(typeChip(ticket.type, true));
  return '<span class="ticket-properties">' + parts.join("") + "</span>";
}

/**
 * One board card. `.ticket-row`'s markup exactly, plus the row LC-227 adds and
 * the class that pins the height it costs.
 */
function cardHTML(ticket) {
  const fraction = ticket.items ? ticket.checked + "/" + ticket.items : "";
  const chips = fraction ? 1 : 2;   // the footer never wraps (`boardCard.ts:28-30`)
  const second = secondRowHTML(ticket);
  const footer =
    '<span class="ticket-meta">' +
    (fraction ? '<span class="fraction">' + fraction + "</span>" : "") +
    (fraction ? '<span class="progress" aria-hidden="true"><i style="width:' + Math.round((ticket.checked / ticket.items) * 100) + '%"></i></span>' : "") +
    ticket.labels.slice(0, chips).map((slug) => labelChip(slug, true)).join("") +
    "</span>";
  return (
    '<button class="ticket-row' +
    (hasSecondRow(ticket) ? " has-properties" : "") +
    (ticket.acknowledged ? " acknowledged acknowledged-agent" : "") +
    '" data-ticket-key="' + ticket.key + '" tabindex="-1">' +
    '<span class="card-top due-right">' +
    '<span class="ticket-key">' + ticket.key + "</span>" +
    (dueOnCard(ticket) ? dueChip(ticket) : "") +
    priorityGlyph(ticket.priority, true) + "</span>" +
    "<strong>" + esc(ticket.title) + "</strong>" +
    (app.rowAbove ? second + footer : footer + second) +
    (ticket.acknowledged ? '<span class="actor">' + esc(ticket.actor) + "</span>" : "") +
    "</button>"
  );
}

/**
 * One list row. The due date follows the labels; the updated-time column
 * was removed during review.
 */
function listRowHTML(ticket) {
  const fraction = ticket.items ? ticket.checked + "/" + ticket.items : "";
  return (
    '<button class="list-row divided" data-ticket-key="' + ticket.key + '" tabindex="-1">' +
    statusDot(ticket.status) +
    '<span class="list-row-key">' + ticket.key + "</span>" +
    priorityGlyph(ticket.priority, true) +
    "<strong>" + esc(ticket.title) + "</strong>" +
    (fraction ? '<span class="list-row-checklist">' + fraction + "</span>" : "") +
    ticket.labels.slice(0, 2).map((slug) => labelChip(slug, true)).join("") +
    dueChip(ticket) +
    "</button>"
  );
}

/* --------------------------------------------------------- the rail's rows */

function menuTrigger(kind, glyph, value, label) {
  return (
    '<button type="button" tabindex="0" class="menu-trigger" data-menu="' + kind +
    '" aria-haspopup="menu" aria-expanded="false" aria-label="' + esc(label) + ": " + esc(value) + '">' +
    (glyph ? '<span class="menu-glyph">' + glyph + "</span>" : "") +
    '<span class="menu-value">' + esc(value) + "</span>" + chevron + "</button>"
  );
}

function railRow(name, control) {
  return '<div class="rail-row"><span class="rail-label">' + esc(name) + "</span><div>" + control + "</div></div>";
}

/**
 * The date field: a Field with a calendar trigger joined to it.
 *
 * Three pieces of state, and the first one is the one a naive version leaves
 * out. `value` is what the ticket says on disk; `text` is what is in the field.
 * They are not the same thing and cannot be derived from each other — the text
 * survives a refusal, because what is refused is not destroyed, and the value
 * is a day that a re-parse of its own display would move. That is why this is a
 * Field in the `CONTEXT.md` sense and not a picker with a text decoration.
 */
const dateState = {
  due:   { value: undefined, text: "", refused: undefined },
  start: { value: undefined, text: "", refused: undefined },
};

/** True while the field holds something other than the value it came from. */
function dirty(state) {
  const shown = state.value ? fieldDate(fromIso(state.value), app.today) : "";
  return state.text.trim() !== shown;
}

function dateFieldHTML(which, label) {
  const state = dateState[which];
  const parsed = parseDate(state.text, app.today);
  // The echo is confirmation, not validation: it appears the moment typed text
  // resolves, and nothing goes red while a person is mid-word. A refusal is
  // only ever reported after a commit — Enter or blur — because `28 Se` is not
  // a state worth reporting on.
  //
  // It appears only while the field is *dirty*. On a field showing what the
  // file says, there is nothing to confirm and the echo would be a permanent
  // second copy of the value under the value.
  const showRefusal = state.refused !== undefined;
  const echo = app.echo && !showRefusal && dirty(state) && parsed.kind === "date"
    ? '<p class="date-echo">→ <strong>' + esc(echoDate(parsed.date)) + "</strong></p>"
    : "";
  return (
    '<div class="date-field' + (showRefusal ? " unresolved" : "") + '">' +
    '<input tabindex="0" data-date="' + which + '" value="' + esc(state.text) +
    '" aria-label="' + esc(label) + '" placeholder="28 Sep">' +
    '<button type="button" tabindex="-1" class="date-trigger" data-picker="' + which +
    '" aria-haspopup="dialog" aria-label="' + esc(label) + ' calendar">' + calendarGlyph + "</button>" +
    "</div>" +
    (showRefusal ? '<p class="date-note">' + esc(state.refused) + "</p>" : echo)
  );
}

/**
 * The estimate control, under whichever system the project is on.
 *
 * Two shapes are offered here and the driver switches between them, because
 * this is the one control the ticket did not settle. The scale is the
 * appearance row's segment; the alternative is the menu every other rail row
 * already is.
 */
function estimateControlHTML(value) {
  const config = project.properties.estimate;
  const read = readEstimate(value, config);
  if (read && read.kind === "foreign")
    return '<span class="estimate-foreign" title="Written under another system, and kept">' + esc(read.text) + "</span>";

  if (config.system === "duration") {
    const unit = read && read.unit ? read.unit : "h";
    const unitName = (UNITS.find((u) => u[0] === unit) || [])[1];
    return (
      '<div class="estimate-duration">' +
      '<input class="input compact mono" tabindex="0" data-estimate="amount" value="' +
      esc(read && read.amount !== undefined ? String(read.amount) : "") +
      '" aria-label="Estimate amount" placeholder="0">' +
      menuTrigger("unit", "", unitName, "Estimate unit") +
      "</div>"
    );
  }

  const scale = config.system === "fibonacci" ? FIBONACCI : TSHIRT;
  const name = (id) => (config.system === "fibonacci" ? id : config.values[id].name);
  if (app.estimateControl === "menu") {
    const shown = value ? name(value) : "None";
    return menuTrigger("estimate", "", shown, "Estimate");
  }
  return (
    '<div class="scale-segment" role="group" aria-label="Estimate">' +
    '<button type="button" tabindex="0" class="none' + (value ? "" : " selected") +
    '" data-scale="" aria-pressed="' + (value ? "false" : "true") + '" aria-label="No estimate">—</button>' +
    scale.map((id) =>
      '<button type="button" tabindex="0"' + (id === value ? ' class="selected"' : "") +
      ' data-scale="' + id + '" aria-pressed="' + (id === value) + '">' + esc(name(id)) + "</button>",
    ).join("") +
    "</div>"
  );
}

/* ========================================================================
   SCENE 1 — the ticket panel
   ========================================================================

   The question: what is the extra width *for*. LC-238s owns the width itself —
   it belongs in `devicePreferences.ts` (ADR 0012, not `localStorage`), the
   560px at `screen-specs.md:213` is line-cited and pinned, and the drag must
   not re-render the subtree per frame. This scene builds on that rather than
   re-deciding it, and answers the other half: a right-hand properties rail
   with the description moved to the top.

   The rail is not cosmetic. Four more rows in the current stacked 84px meta
   grid (`screen-specs.md:227-231`) push the description roughly 100px down,
   below the fold — which the **560 · today** width below shows.
*/

const folderGlyph = '<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 3.5 a1 1 0 0 1 1-1 h3 l1.2 1.4 h4.8 a1 1 0 0 1 1 1 v5.6 a1 1 0 0 1-1 1 h-9 a1 1 0 0 1-1-1 z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>';

function panelScene() {
  const ticket = tickets()[0];
  const properties = project.properties;

  /* The rail, in the order it reads: what the ticket *is*, then what kind of
     work it is and how much, then when, then the free axis. Labels go last
     because they are the only row that grows — a list of chips at the foot of
     a rail costs nothing when it wraps to three lines, and the same list in the
     middle moves everything under it. */
  const rail = [
    railRow("Status", menuTrigger("status", statusDot(ticket.status), statusName(ticket.status), "Status")),
    railRow("Priority", menuTrigger("priority", priorityGlyph(ticket.priority), priorityName(ticket.priority), "Priority")),
    properties.type.enabled
      ? railRow("Type", menuTrigger("type", '<span class="label-dot label-' + properties.type.values[ticket.type].color + '"></span>', properties.type.values[ticket.type].name, "Type"))
      : "",
    properties.estimate.enabled ? railRow("Estimate", estimateControlHTML(ticket.estimate)) : "",
    /* Start above Due, chronologically, and adjacent — which is the pair the
       grammar's last paragraph is about. The same typed string means the same
       day in both, and the price of that is that Start is forward-only too. */
    properties.start.enabled ? railRow("Start", dateFieldHTML("start", "Start date")) : "",
    properties.due.enabled ? railRow("Due", dateFieldHTML("due", "Due date")) : "",
    railRow("Labels", '<div class="meta-labels">' + ticket.labels.map((slug) => labelChip(slug)).join("") +
      '<button type="button" tabindex="0" class="label-chip addable" data-menu="labels" aria-haspopup="menu" aria-expanded="false" aria-label="Labels">+ add</button></div>'),
  ].join("");

  const description =
    '<section class="panel-section description-block">' +
    "<h3>Description" +
    '<button tabindex="0" class="ghost small description-edit" aria-label="Edit description">' +
    '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M9.6 1.9 12.1 4.4 4.9 11.6 1.9 12.1 2.4 9.1 z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>Edit</button>' +
    "</h3>" +
    '<div class="description-view"><div class="markdown">' +
    "<p>Brainstorm with an LLM agent about what other fields we should support. A few I can think of are Type — Bug/Task — due date, start date and effort.</p>" +
    "<ul><li>When a due date is within a week, highlight the ticket or add an indicator.</li>" +
    "<li>Should the card show both dates, or only Due? Todoist is the reference.</li></ul>" +
    "<p>In the UX prototype, consider increasing the width of the ticket panel and adding a right panel holding all the properties, moving the description to the top.</p>" +
    "</div></div></section>";

  const checklist =
    '<section class="panel-section"><h3>Checklist <span class="section-count">13/34</span>' +
    '<span class="panel-progress"><i style="width:38%"></i></span></h3>' +
    '<ul class="checklist">' +
    ["Prototype the ticket panel: right-hand properties rail, description moved to the top",
     "Prototype the four due rungs and their visual treatments, in both appearances",
     "Prototype the card's second footer row"].map((text) =>

  return (
