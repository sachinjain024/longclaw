<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LongClaw mark">
  <!--
    LongClaw owl mark — chevron-and-ring, product-icon variant 4 (LC-62,
    selected 2026-08-13 from the concept round in assets/brand/concepts/).
    Replaces variant A "talon" (decisions.md D13). An abstract/geometric owl:
    a chevron brow that drops to a point, an open-ring face, a kite beak.
    No likeness to any existing character.

    Construction:
      brow   constant-thickness chevron band; corners (1,1)-(63,1), valley
             (32,18.8), cap bottoms (2.5,12.2)/(61.5,12.2); the underside
             kinks at (28.8,27.5)/(35.2,27.5) into a drop point at (32,34)
      face   open ring centred (32,33.5), midline r=24, stroke 7
             (outer 27.5, inner 20.5), gap ±57° about 12 o'clock so the
             brow passes through with clear space
      beak   kite 32,35.3 35.6,40.6 32,47.5 28.4,40.6

    The mark is single-colour: both fills and the ring stroke take
    currentColor, so it sits on any surface (set color in app chrome).
    The app icon renders it white on #B45F06 (assets/brand/app-icon/).
  -->
  <path fill="currentColor" d="M1 1 L32 18.8 L63 1 L61.5 12.2 L35.2 27.5 L32 34 L28.8 27.5 L2.5 12.2 Z"/>
  <path fill="currentColor" d="M32 35.3 L35.6 40.6 L32 47.5 L28.4 40.6 Z"/>
  <path fill="none" stroke="currentColor" stroke-width="7" d="M52.13 20.43 A24 24 0 1 1 11.87 20.43"/>
</svg>
